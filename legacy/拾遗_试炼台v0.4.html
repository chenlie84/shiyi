<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拾遗 · 试炼台 v0.4</title>
<style>
  :root{
    --paper:#f4efe2;--paper2:#e8dfc9;--ink:#241f18;--ink2:#6b6154;
    --line:#c9bda2;--jade:#2f6b52;--cin:#a83b2c;--gold:#a8811f;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",monospace;
    font-size:13px;line-height:1.6;user-select:none;
    background-image:linear-gradient(rgba(201,189,162,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(201,189,162,.22) 1px,transparent 1px);
    background-size:16px 16px;
  }
  .app{max-width:1180px;margin:0 auto;padding:12px}
  .top{display:flex;align-items:center;gap:14px;border:2px solid var(--ink);background:var(--paper2);padding:7px 12px;margin-bottom:10px;flex-wrap:wrap}
  .logo{font-size:15px;font-weight:800;letter-spacing:4px}
  .stat{font-size:12px;color:var(--ink2)}
  .stat b{color:var(--ink)}
  .spacer{flex:1}
  button{font-family:inherit;font-size:12px;padding:5px 12px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer;letter-spacing:1px}
  button:hover{background:var(--ink);color:var(--paper)}
  button:disabled{opacity:.3;cursor:not-allowed}
  button.sm{padding:1px 6px;font-size:10px;border-width:1px;letter-spacing:0}
  .main{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
  .left{flex:0 0 auto}
  canvas{display:block;border:3px solid var(--ink);image-rendering:pixelated;background:#15120e}
  .right{flex:1;min-width:380px;display:flex;flex-direction:column;gap:8px}
  .panel{border:2px solid var(--ink);background:var(--paper2);padding:9px 11px}
  .ph{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:2px;color:var(--ink2);margin-bottom:7px}
  .ph:after{content:"";flex:1;height:1px;background:var(--line)}
  /* 三才 */
  .slots{display:flex;align-items:center;gap:3px;justify-content:center}
  .slot{width:78px;height:92px;border:2px dashed var(--line);background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:.1s}
  .slot.filled{border-style:solid;border-color:var(--ink)}
  .slot:hover{background:#fffdf7}
  .slot .pos{position:absolute;top:1px;left:0;right:0;text-align:center;font-size:9px;color:var(--ink2);letter-spacing:1px}
  .slot .el{font-size:23px;font-weight:700;line-height:1;font-family:"STKaiti","KaiTi",serif}
  .slot .fx{font-size:8px;color:var(--ink2);line-height:1.3}
  .conn{width:36px;text-align:center;font-size:10px;line-height:1.2}
  .conn .r{font-size:12px;font-weight:700}
  .mulbox{display:flex;align-items:baseline;gap:9px;margin:6px 0 3px;flex-wrap:wrap}
  .big{font-size:26px;font-weight:800;letter-spacing:-1px;line-height:1}
  .tag{font-size:10.5px;padding:1px 6px;border:1px solid currentColor;letter-spacing:1px}
  /* 属性 */
  .attrs{display:grid;grid-template-columns:repeat(4,1fr);gap:2px 8px;font-size:11.5px;margin-top:5px}
  .attrs div{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);padding:1px 0}
  .attrs span{color:var(--ink2)}
  /* 七星技能 */
  .skills{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .sk{border:2px solid var(--line);background:var(--paper);padding:5px 7px;cursor:pointer;position:relative;transition:.1s}
  .sk:hover:not(.dis){border-color:var(--gold);background:#fffdf7}
  .sk.dis{opacity:.32;cursor:not-allowed}
  .sk .nm{font-size:12px;font-weight:700;display:flex;justify-content:space-between;gap:4px}
  .sk .star{font-size:8.5px;color:var(--gold);letter-spacing:.5px}
  .sk .ds{font-size:9.5px;color:var(--ink2);line-height:1.35;margin-top:1px}
  .sk .pw{font-size:9.5px;color:var(--cin);font-weight:700}
  .sk .lv{font-size:9px;color:#8a5a1f;font-weight:800;letter-spacing:0}
  .sk .lk{font-size:9px;margin-top:3px;padding:1px 4px;border:1px dashed var(--line);color:var(--ink);background:#fffdf7;letter-spacing:0;font-weight:600}
  .sk .lk:hover{border-color:#8a5a1f;background:#fffaf0;color:var(--ink)}
  .sk .lk.dim{border-style:dotted;opacity:.62;cursor:default;font-weight:400;background:none}
  .sk .lk.dim:hover{background:none;border-color:var(--line);color:var(--ink2)}
  /* 经脉 */
  .merwrap{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
  .merbody{flex:0 0 320px;background:#faf6ea;border:1px solid var(--line)}
  .merinfo{flex:1;min-width:200px}
  .merinfo .mrow{font-size:11.5px;border-bottom:1px dotted var(--line);padding:3px 0;display:flex;justify-content:space-between;gap:8px}
  .merinfo .mrow b{font-weight:700}
  .merinfo h4{margin:10px 0 4px;font-size:11px;letter-spacing:2px;color:var(--ink2);font-weight:400}
  .node{cursor:default}
  .node.on{cursor:pointer}
  .node.on:hover circle{stroke-width:3}
  .merbar{display:flex;align-items:center;gap:8px;margin:6px 0 10px;font-size:11.5px}
  .xpbar{flex:1;height:7px;background:var(--paper2);border:1px solid var(--line);max-width:200px}
  .xpbar i{display:block;height:100%;background:#8a5a1f}
  .sk.cool{opacity:.5}
  .sk.cool:after{content:"冷却";position:absolute;right:4px;bottom:2px;font-size:8px;color:var(--cin)}
  /* 行囊卡片 */
  .bag{display:flex;gap:5px;flex-wrap:wrap;min-height:64px;margin-top:6px}
  .item{width:104px;border:2px solid var(--line);background:var(--paper);padding:3px 3px 4px;text-align:center;cursor:pointer;position:relative}
  .item:hover{filter:brightness(1.05)}
  .item .el{font-size:16px;font-weight:700;line-height:1.1;font-family:"STKaiti","KaiTi",serif}
  .item .nm{font-size:9.5px;color:var(--ink);font-weight:700;letter-spacing:.5px}
  .item .n{font-size:8px;color:var(--ink2)}
  .item .af{font-size:8px;line-height:1.35;margin-top:2px}
  .item.broken{border-style:dashed}
  .item.unid{background:#efe9db}
  .item.unid .el{font-size:19px}
  .item .act{display:flex;gap:2px;justify-content:center;margin-top:3px}
  .item .rar{position:absolute;top:0;left:0;right:0;font-size:8px;font-weight:800;letter-spacing:1.5px;
    line-height:1.4;background:rgba(255,255,255,.55);border-bottom:1px solid currentColor}
  .item .bd{display:flex;gap:2px;justify-content:center;flex-wrap:wrap;margin-top:2px}
  .item .bd i{font-style:normal;font-size:7.5px;padding:0 2px;border:1px solid currentColor;line-height:1.3}
  .b1{color:#a8811f}.b2{color:#7a4a8a}.b3{color:#a83b2c}
  /* 详情弹层 */
  .sec{font-size:9.5px;letter-spacing:3px;color:var(--ink2);margin:11px 0 3px;
    border-bottom:1px solid var(--line);padding-bottom:2px}
  .afrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
    border-bottom:1px dotted var(--line);padding:2px 0;font-size:12px}
  .afrow .k{color:var(--ink2);font-size:9.5px;letter-spacing:1px}
  .modrow{border:1px solid currentColor;background:rgba(255,255,255,.5);padding:4px 8px;margin-top:4px;font-size:11.5px;line-height:1.7}
  .modrow b{font-weight:800;letter-spacing:1px}
  .modrow .up{color:#2f6b52;font-weight:700}
  .modrow .dn{color:#a83b2c}
  .unkrow{display:flex;gap:6px;justify-content:center;margin:14px 0 6px}
  .unkrow i{font-style:normal;width:52px;height:52px;border:2px dashed var(--line);
    display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--ink2);font-weight:700}
  .row2{display:flex;justify-content:space-between;align-items:center;gap:8px;
    border-bottom:1px dotted var(--line);padding:3px 0;font-size:11.5px}
  .pickgrid{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}
  .val{display:flex;gap:14px;font-size:11px;color:var(--ink2);margin-top:10px;flex-wrap:wrap}
  /* 拾遗三选一 */
  .relic{border:2px solid;background:var(--paper);padding:12px 12px 10px;cursor:pointer;transition:.12s;
    min-height:126px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center}
  .relic:hover{background:#fffdf7;transform:translateY(-2px)}
  .relic:active{transform:none}
  .relic .take{margin-top:8px;font-size:10.5px;letter-spacing:4px;border-top:1px dotted currentColor;
    padding-top:5px;width:100%;opacity:.85}
  /* 鉴定揭示 */
  .modal.reveal{animation:reveal .46s cubic-bezier(.2,1.3,.4,1)}
  @keyframes reveal{from{transform:scale(.94);opacity:.25}to{transform:none;opacity:1}}
  /* 弹层 */
  .mask{position:fixed;inset:0;background:rgba(36,31,24,.62);display:none;align-items:center;justify-content:center;z-index:50}
  .mask.on{display:flex}
  .modal{background:var(--paper);border:3px solid var(--ink);padding:16px 20px;max-width:600px;width:92%;max-height:86vh;overflow-y:auto}
  .modal h3{margin:0 0 8px;font-size:15px;letter-spacing:2px}
  .modal p{margin:5px 0;font-size:12.5px;color:var(--ink2)}
  .modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
  .tip{font-size:11px;color:var(--ink2);margin-top:6px;line-height:1.65}
  .sub2{font-size:10.5px;color:var(--ink2)}
  .log{height:74px;overflow-y:auto;font-size:11px;line-height:1.6;color:var(--ink2);border:1px solid var(--line);background:var(--paper);padding:5px 7px}
  .log div{border-bottom:1px dotted var(--line);padding:1px 0}
  /* 落宝浮层 */
  .left{position:relative}
  #loot{position:absolute;left:0;top:6px;width:640px;display:flex;flex-direction:column;gap:4px;align-items:center;pointer-events:none}
  .lootcard{pointer-events:auto;cursor:pointer;border:2px solid;background:rgba(18,16,12,.9);
    padding:3px 10px;font-size:11.5px;letter-spacing:1px;display:flex;gap:8px;align-items:center;
    animation:dropin .32s cubic-bezier(.2,1.4,.5,1)}
  .lootcard b{font-weight:800}
  .lootcard .unk{font-size:9.5px;border:1px solid;padding:0 3px;opacity:.9}
  @keyframes dropin{from{transform:translateY(-16px) scale(.9);opacity:0}to{transform:none;opacity:1}}
  .lootcard .hint{font-size:9.5px;opacity:1;letter-spacing:0;padding-left:2px}
  /* 图鉴 */
  .dexgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:8px}
  .dexcell{border:1px solid var(--line);background:var(--paper);padding:4px 2px;text-align:center;font-size:9.5px;line-height:1.3;color:var(--ink2)}
  .dexcell.got{border-color:var(--ink);color:var(--ink);font-weight:700}
  .dexcell .d5{color:#8d8474}
  @media(max-width:960px){.right{min-width:100%}}
</style>
</head>
<body>
<div class="app">

  <div class="top">
    <div class="logo">拾 遗 · 试 炼</div>
    <div class="stat">第 <b id="wave">1</b> 波</div>
    <div class="stat">回合 <b id="turn">1</b></div>
    <div class="stat">最高 <b id="best">0</b></div>
    <div class="stat">灵石 <b id="stones">0</b></div>
    <div class="stat">器魂 <b id="soul" style="color:#7a4a8a">0</b></div>
    <div class="stat">境界 <b id="lv">1</b> <span id="xptxt" style="font-size:10px">0/26</span></div>
    <button onclick="showMeridian()" style="border-color:#8a5a1f">经脉 <b id="pts" style="color:#8a5a1f">0</b></button>
    <button onclick="showDex()" style="border-color:#3f7a6a">拾遗录 <b id="dexn" style="color:#3f7a6a">0</b></button>
    <div class="spacer"></div>
    <div class="stat">难度
      <select id="diff" onchange="setDiff()" style="font-family:inherit;font-size:12px;border:1px solid var(--line);background:var(--paper);padding:2px 4px">
        <option value="0.7">练气 · 易</option>
        <option value="1" selected>筑基 · 常</option>
        <option value="1.5">金丹 · 难</option>
        <option value="2.2">元婴 · 苦</option>
        <option value="3.2">化神 · 死</option>
      </select>
    </div>
    <button onclick="showHelp()">玩法</button>
    <button onclick="resetAll()">重来</button>
  </div>

  <div class="main">
    <div class="left">
      <canvas id="cv" width="640" height="520"></canvas>
      <div id="loot"></div>
      <div class="tip" style="width:640px">点下面七星技能出招。敌人会一起还手。</div>
    </div>

    <div class="right">
      <div class="panel">
        <div class="ph">三才 · 天 / 人 / 地 <span class="sub2" style="letter-spacing:0">点装备看词条</span></div>
        <div class="slots" id="slots"></div>
        <div class="mulbox">
          <div class="big" id="mul">×1.00</div>
          <div class="tag" id="school" style="color:var(--ink2)">未成阵</div>
          <div class="sub2" id="rels">—</div>
        </div>
        <div class="attrs" id="attrs"></div>
      </div>

      <div class="panel">
        <div class="ph">北斗七星 · 七技</div>
        <div class="skills" id="skills"></div>
      </div>

      <div class="panel">
        <div class="ph">战报</div>
        <div class="log" id="log"></div>
      </div>
    </div>
  </div>

  <div class="panel" style="margin-top:10px">
    <div class="ph">行囊 <span class="sub2" id="bagcnt"></span>
      <button class="sm" onclick="salvageJunk()" style="border-color:#7a4a8a;color:#7a4a8a">拆凡品</button>
      <span class="sub2" style="letter-spacing:0">点卡片看详情 · 「炉」开熔炉打造 · 「拆」得器魂 · 宝品以上捡到时是蒙尘的，得先鉴</span>
    </div>
    <div class="bag" id="bag"></div>
  </div>
</div>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>

<script>
/* ==========================================================
   拾遗 · 试炼台 v0.3
   三才配装 → 七技生成 → 多怪回合制
   ========================================================== */

const XING=['木','火','土','金','水'];
const SHENG={木:'火',火:'土',土:'金',金:'水',水:'木'};
const KE={木:'土',土:'水',水:'火',火:'金',金:'木'};
const COL={木:'#4d8a5e',火:'#b8432f',土:'#a8811f',金:'#5b7c96',水:'#6b4a7a'};
const MULT={生:2,逆生:1,比和:1,克:0.25};
const SHA_LOSS=0.75;

/* ---------- 词条：仿 PoE 的前缀 / 后缀 / T 级 ---------- */
/* 前缀：纯数值，最多 3 条。数组由 T5 排到 T1 */
const PRE={
  hp :{n:'气血',c:'#a83b2c',v:[15,30,50,75,110]},
  atk:{n:'攻击',c:'#b8432f',v:[4,7,11,16,22]},
  mag:{n:'法攻',c:'#6b4a7a',v:[3,5,8,12,17]},
  def:{n:'防御',c:'#5b7c96',v:[2,4,6,9,13]},
};
/* 后缀：百分比/机制，最多 3 条 */
const SUF={
  crit   :{n:'暴击',c:'#c9862f',v:[3,5,8,11,15],  u:'%'},
  critDmg:{n:'暴伤',c:'#c9862f',v:[10,18,26,36,48],u:'%'},
  inc    :{n:'增伤',c:'#a83b2c',v:[6,10,15,20,26],u:'%'},
  red    :{n:'减伤',c:'#2f6b52',v:[4,7,10,14,18], u:'%'},
  leech  :{n:'噬血',c:'#2f6b52',v:[3,5,7,10,14],  u:'%'},
  reflect:{n:'反伤',c:'#6b4a7a',v:[5,9,14,19,25], u:'%'},
  pen    :{n:'破防',c:'#5b7c96',v:[6,10,15,20,26],u:'%'},
  dbl    :{n:'连击',c:'#38617f',v:[5,8,12,16,20], u:'%'},
};
/* 稀有后缀：只有它涨技能等级，常规池里抽不到，单独走 16% 稀有通道 */
const RARE={ sk:{n:'技阶',c:'#8a5a1f',v:[1,1,1,1,2],u:''} };
Object.assign(SUF, RARE);
const PREK=Object.keys(PRE), SUFK=Object.keys(SUF).filter(k=>k!=='sk');
const TIERC=['#8d8474','#6b6154','#7a6a3a','#a8811f','#a83b2c'];  // T5 → T1

/* 五行底子倾向：同一种五行，更容易长出贴合它的词条。
   金主锐 → 攻击/破防；木主生 → 气血/噬血；水主柔 → 法攻/减伤；
   火主烈 → 攻击/暴伤；土主厚 → 防御/反伤。 */
const ELEM_PREF={
  金:{pre:['atk','atk','def'],   suf:['pen','pen','crit','critDmg','inc']},
  木:{pre:['hp','hp','atk'],     suf:['leech','leech','red','dbl','inc']},
  水:{pre:['mag','mag','hp'],    suf:['red','red','leech','leech','dbl']},
  火:{pre:['atk','atk','mag'],   suf:['critDmg','critDmg','inc','crit','dbl']},
  土:{pre:['def','def','hp'],    suf:['reflect','reflect','red','leech','inc']},
};

/* ---------- 稀有度：掉落要像开箱子，不能像流水线 ---------- */
const RAR_NAME=['','凡品','灵品','宝品','仙品','道品'];
const RAR_COL =['','#8d8474','#3f7a6a','#a8811f','#7a4a8a','#a83b2c'];
const RAR_BG  =['','#f4efe2','#e9f1ee','#f8f1da','#f1e9f5','#f8e7e3'];
const RAR_AFFIX=[0,2,3,4,5,6];          // 词条条数
const RAR_NEED_IDENT=[0,0,0,1,1,1];     // 宝品起，捡到时看不清

/* 铭文：宝品起必带。强，但有代价 —— 逼玩家取舍 */
const INSCR=[
  {n:'断', d:'暴伤 +80%，暴击 -12%', up:{critDmg:80},  dn:{crit:-12}},
  {n:'噬', d:'噬血 +14%，减伤 -8%',  up:{leech:14},    dn:{red:-8}},
  {n:'疾', d:'连击 +20%，攻击 -12%', up:{dbl:20},      dn:{atkPct:-12}},
  {n:'锐', d:'破防 +30%，防御 -40%', up:{pen:30},      dn:{defPct:-40}},
  {n:'重', d:'攻击 +30%，连击 -15%', up:{atkPct:30},   dn:{dbl:-15}},
  {n:'守', d:'减伤 +20%，攻击 -15%', up:{red:20},      dn:{atkPct:-15}},
  {n:'盈', d:'气血 +35%，法攻 -25%', up:{hpPct:35},    dn:{magPct:-25}},
  {n:'煞', d:'增伤 +30%，气血 -18%', up:{inc:30},      dn:{hpPct:-18}},
];

/* 器灵：仙品起。不讲数值，直接改规则 */
const SPIRIT=[
  {n:'不息', d:'每回合回复 4% 气血',        k:'regen', v:4},
  {n:'贪狼', d:'噬血 +15%，减伤 -10%',      k:'leech', v:15, dn:{red:-10}},
  {n:'玄冥', d:'全体技伤害 +30%',           k:'aoe',   v:30},
  {n:'太乙', d:'单体技伤害 +30%',           k:'single',v:30},
  {n:'回天', d:'气血低于三成时，伤害 +50%', k:'low',   v:50},
  {n:'承影', d:'开战首回合，伤害 +70%',     k:'first', v:70},
];

/* 诅咒：道品必带，摘不掉 */
const CURSE=[
  {n:'贪', d:'每回合自损 3% 气血', k:'drain', v:3},
  {n:'滞', d:'减伤 -20%',          k:'red',   v:-20},
  {n:'耗', d:'技能威力 -15%',      k:'weak',  v:15},
];

const GNAME=['','凡品','灵品','宝品','仙品','道品'];

/* 装备名：全部取自公有领域古籍，按品级递进 */
const ITEM_NAMES={
  金:['鱼肠剑','巨阙剑','纯钧剑','湛卢剑','泰阿剑','昆吾剑'],   // 《越绝书》《吴越春秋》《列子》
  木:['桃木杖','九节杖','打神鞭','缚龙索','降魔杵','青帝幡'],   // 《封神演义》、道藏

function merBonus(){

/* ---------- 生成装备 ---------- */
function effGrade(it){ return it.broken? Math.max(1,it.grade-1): it.grade; }

/* T 级：1 最强。稀有度越高越容易出高 T —— 但凡品最高 T5，道品在 T1/T2 之间 */
function rollTier(grade){
  const best=Math.max(1, Math.min(5, 7-grade));   // 道5→2 · 仙4→3 · 宝3→4 · 灵2→5
  const t = Math.random()<0.5 ? best : best-1;
  return Math.max(1,Math.min(5,t));
}
function rollAffix(grade, kind, elem){
  if(!kind) kind = Math.random()<0.45?'pre':'suf';
  const t=rollTier(grade);
  // 稀有通道：16% 直接出「技阶」，不看五行倾向
  if(kind==='suf' && Math.random()<0.16){
    return {kind:'suf', k:'sk', t, v:RARE.sk.v[5-t]};
  }
  const P=ELEM_PREF[elem];
  let key;
  if(P && Math.random()<0.8){          // 八成顺着五行长，两成完全随机
    const pool = kind==='pre'? P.pre : P.suf;
    key = pool[Math.floor(Math.random()*pool.length)];
  } else {
    const pool = kind==='pre'? PREK : SUFK;
    key = pool[Math.floor(Math.random()*pool.length)];
  }
  const def = kind==='pre'? PRE[key] : SUF[key];
  return {kind, k:key, t, v:def.v[5-t]};
}
function cntPre(it){ return it.affixes.filter(a=>a.kind==='pre').length; }
function cntSuf(it){ return it.affixes.filter(a=>a.kind==='suf').length; }
function afDef(a){ return a.kind==='pre'?PRE[a.k]:SUF[a.k]; }
function afUnit(a){ const d=afDef(a); return a.kind==='pre' ? '' : (d.u||''); }
function afLabel(a){
  const d=afDef(a), u=afUnit(a);
  return '<span style="color:'+d.c+'">'+d.n+' +'+a.v+u+'</span>'+
         '<span style="color:'+TIERC[a.t-1]+';font-weight:700"> T'+a.t+'</span>';
}
function afText(it){
  return it.affixes.map(a=>{ const d=afDef(a); return d.n+'+'+a.v+afUnit(a)+' T'+a.t; }).join(' / ');
}

/* ---------- 展示名 / 估价 / 器魂 ---------- */
/* 未鉴定时连名字都不给看，只给品级 —— 悬念全压在「鉴」这一下 */
function nmOf(it){ return it.ident===false ? '未鉴之器' : it.name; }
function sellPrice(it){
  if(it.ident===false) return Math.round(Math.pow(it.grade,2)*5);
  return Math.round(Math.pow(it.grade,2)*10 + it.affixes.reduce((a,af)=>a+(6-af.t)*5,0));
}
function soulOf(it){
  if(it.ident===false) return 1;
  const base=[0,1,2,4,8,15][it.grade]||1;
  return base + it.affixes.filter(a=>a.t<=2).length;   // 高 T 词条能多榨出点魂
}
const MODN={hp:'气血',atk:'攻击',mag:'法攻',def:'防御',
  crit:'暴击',critDmg:'暴伤',inc:'增伤',red:'减伤',leech:'噬血',reflect:'反伤',
  pen:'破防',dbl:'连击',sk:'技阶',
  atkPct:'攻击',magPct:'法攻',defPct:'防御',hpPct:'气血'};
function modTxt(k,v){
  const nm=MODN[k]||k;
  const u = (PRE[k]||k==='sk') ? '' : '%';
  return nm+' '+(v>0?'+':'')+v+u;
}
function modLine(m,cls){
  return Object.keys(m||{}).map(k=>'<span class="'+cls+'">'+modTxt(k,m[k])+'</span>').join('　');
}
function reTier(a,t){
  a.t=Math.max(1,Math.min(5,t));
  const def=afDef(a);
  a.v=def.v[5-a.t];
}
/* 该装备还能不能长词条：前缀满 3 条、后缀满 3 条，合计上限 6 */
function freeKind(it){
  const p=cntPre(it)<3, s=cntSuf(it)<3;
  if(p&&s) return Math.random()<0.5?'pre':'suf';
  return p?'pre': s?'suf': null;
}

/* 掉率：凡 58 / 灵 26 / 宝 11 / 仙 4 / 道 1。波数越深、难度越高，好货越多 */
function rollRarity(wave){
  const t=Math.min(1,(wave||1)/35 + Math.max(0,G.diff-1)*0.22);
  const r=Math.random()*100;
  if(r < 58-t*12) return 1;
  if(r < 84-t*5)  return 2;
  if(r < 95)      return 3;
  if(r < 99)      return 4;
  return 5;
}

function fillAffixes(it,n){
  const targetPre=Math.ceil(n/2);
  let pre=0,suf=0;
  for(let i=0;i<n;i++){
    let kind;
    if(pre>=3) kind='suf';
    else if(suf>=3) kind='pre';
    else if(pre<targetPre) kind='pre';
    else kind='suf';
    it.affixes.push(rollAffix(it.grade, kind, it.x));
    if(kind==='pre') pre++; else suf++;
  }
}

function makeItem(wave, forceBroken, forceGrade){
  const x=XING[Math.floor(Math.random()*5)];
  const y=Math.random()<0.5?'阳':'阴';
  const grade=forceGrade!==undefined? forceGrade : rollRarity(wave||1);
  const broken = forceBroken!==undefined? forceBroken : Math.random()< (grade>=3?0.16:0.34);
  const it={id:G.uid++,x,y,grade,broken,affixes:[],name:'',ident:true};
  fillAffixes(it, RAR_AFFIX[grade]);
  if(grade>=3) it.inscr=INSCR[Math.floor(Math.random()*INSCR.length)];
  if(grade>=4) it.spirit=SPIRIT[Math.floor(Math.random()*SPIRIT.length)];
  if(grade>=5) it.curse=CURSE[Math.floor(Math.random()*CURSE.length)];
  const pool=ITEM_NAMES[x];
  const idx=Math.min(pool.length-1, (grade-1) + (Math.random()<0.5?0:1));
  it.base=pool[idx];
  it.name=it.base+(broken?'·残':'')+'·'+y+x;
  if(RAR_NEED_IDENT[grade]) it.ident=false;      // 捡到时还看不清
  return it;
}

/* ---------- 三才 ---------- */
function relOf(a,b){
  if(a.x===b.x) return '比和';
  if(SHENG[a.x]===b.x) return '生';
  if(SHENG[b.x]===a.x) return '逆生';
  return '克';
}
function evaluate(arr){
  const a=arr[0],b=arr[1],c=arr[2];
  if(!a||!b||!c){
    const rs=[];
    if(a&&b) rs.push(relOf(a,b));
    if(b&&c) rs.push(relOf(b,c));
    let m=1; rs.forEach(r=>m*=MULT[r]);
    return {r1:rs[0]||'—',r2:rs[1]||'—',m,total:m,sha:0,burn:false,partial:true};
  }
  const r1=relOf(a,b), r2=relOf(b,c);
  let m=MULT[r1]*MULT[r2];
  let sha=0;
  if(r1==='克') sha+=SHA_LOSS;
  if(r2==='克') sha+=SHA_LOSS;
  const burn= sha>0 && r2==='生';
  const raw=m+(burn?sha:0);
  const yyAll=a.y==='阳'&&b.y==='阳'&&c.y==='阳';
  const yyNone=a.y==='阴'&&b.y==='阴'&&c.y==='阴';
  const yyMul=(yyAll||yyNone)?0.5:1;
  return {r1,r2,m,sha,burn,raw,yyAll,yyNone,yyMul,total:raw*yyMul};
}

/* ---------- 属性（词条 + 铭文 + 器灵 + 诅咒 + 经脉） ---------- */
/* 铭文/诅咒/器灵统用这一套键：xxPct 走乘算，PRE 里的走绝对值，其余进 q */
function applyMod(s,q,mods){
  if(!mods) return;
  for(const k in mods){
    const v=mods[k];
    if(k==='atkPct'||k==='magPct'||k==='defPct'||k==='hpPct') q[k]=(q[k]||0)+v;
    else if(PRE[k]) s[k]=(s[k]||0)+v;
    else q[k]=(q[k]||0)+v;
  }
}
function calcStats(){
  const e=evaluate(G.slots);
  const s={hp:66,atk:13,mag:8,def:0};
  const q={inc:0,red:0,leech:0,reflect:0,pen:0,crit:5,critDmg:50,dbl:0,sk:0,skMer:0,healB:0,
           hpPct:0,atkPct:0,magPct:0,defPct:0,
           sp:{aoe:0,single:0,low:0,first:0,regen:0,drain:0,weak:0}};
  // 经脉先落地
  const mb=merBonus();
  s.hp+=mb.hp||0; s.atk+=mb.atk||0; s.mag+=mb.mag||0; s.def+=mb.def||0;
  q.hpPct+=mb.hpPct||0;
  q.red+=mb.red||0; q.crit+=mb.crit||0; q.critDmg+=mb.critDmg||0;
  q.pen+=mb.pen||0; q.reflect+=mb.reflect||0; q.dbl+=mb.dbl||0;
  q.healB+=mb.healB||0; q.skMer+=mb.sk||0;   // 经脉的技阶单独记，别和装备混

  G.slots.forEach(it=>{
    if(!it || it.ident===false) return;     // 没鉴定就没效果，逼你去鉴
    const eg=effGrade(it);
    s.hp+=eg*6; s.atk+=eg*1.7; s.def+=eg*0.8;
    let skl=0;
    it.affixes.forEach(a=>{
      if(a.kind==='pre') s[a.k]=(s[a.k]||0)+a.v;
      else if(a.k==='sk'){ skl+=a.v; q.sk+=a.v; }   // 技阶只涨技能等级，不进战斗数值
      else q[a.k]=(q[a.k]||0)+a.v;
    });
    it.skLv=skl;                                    // 本器技阶
    if(it.inscr){ applyMod(s,q,it.inscr.up); applyMod(s,q,it.inscr.dn); }
    if(it.spirit){
      applyMod(s,q,it.spirit.dn);
      const sp=it.spirit;
      if(sp.k==='aoe')    q.sp.aoe+=sp.v;
      if(sp.k==='single') q.sp.single+=sp.v;
      if(sp.k==='low')    q.sp.low+=sp.v;
      if(sp.k==='first')  q.sp.first+=sp.v;
      if(sp.k==='regen')  q.sp.regen+=sp.v;
      if(sp.k==='leech')  q.leech+=sp.v;
    }
    if(it.curse){
      const c=it.curse;
      if(c.k==='drain') q.sp.drain+=c.v;
      if(c.k==='red')   q.red+=c.v;
      if(c.k==='weak')  q.sp.weak+=c.v;
    }
  });
  // 乘算类
  s.atk=Math.round(s.atk*(1+q.inc/100)*(1+q.atkPct/100));
  s.mag=Math.round(s.mag*(1+q.inc/100)*(1+q.magPct/100));
  s.def=Math.max(0, Math.round(s.def*(1+q.defPct/100)));
  s.hp =Math.max(1, Math.round(s.hp*(1+q.hpPct/100)));
  q.red=Math.min(60,Math.max(-40,q.red));           // 减伤上限 60%，也能被诅咒压成负数
  return {s,q,e};
}

const ELEM_SKILL={

const REL_SKILL={
  '生'  :{n:'生生诀',kind:'buff',pow:1.0,d:'下一击伤害翻倍'},   // 「生生之谓易」，《周易》
  '逆生':{n:'逆流引',kind:'buff',pow:0.9,d:'反弹本回合伤害'},

const SK_MAX=7;
function clampLv(n){ return Math.max(1, Math.min(SK_MAX, n)); }

function buildSkills(){
  const [a,b,c]=G.slots;
  const st=calcStats();
  const gb=st.q.skMer||0;                                // 只取经脉（百会）给的全局技阶
  const skOf=it=> (it? (it.skLv||0) : 0);
  const total=skOf(a)+skOf(b)+skOf(c);
  const sk=[];
  const names=['天枢','天璇','天玑','天权','玉衡','开阳','摇光'];

  // 1-3 本源技：等级看自己那件装备的技阶
  [a,b,c].forEach(it=>{
    if(!it){ sk.push(null); return; }
    const t=ELEM_SKILL[it.x+it.y];
    const dup = sk.some(x=>x&&x.name===t.n);
    sk.push({pos:names[sk.length],name:(dup? t.n+'·贰' : t.n),kind:t.kind,pow:t.pow,desc:t.d,
      elem:it.x,grade:effGrade(it),from:'本源',item:it,
      lv:clampLv(1+skOf(it)+gb)});
  });
  // 4-5 合击技：等级取两边平均
  const pairs=[[a,b],[b,c]];
  pairs.forEach((p,i)=>{
    if(!p[0]||!p[1]){ sk.push(null); return; }
    const r=relOf(p[0],p[1]);
    const t=REL_SKILL[r];
    const boost = r==='生'?1.25:1;
    sk.push({pos:names[3+i],name:t.n,kind:t.kind,pow:t.pow*boost,desc:t.d,
      elem:p[0].x,grade:Math.min(effGrade(p[0]),effGrade(p[1])),rel:r,from:'合击',
      lv:clampLv(1+Math.floor((skOf(p[0])+skOf(p[1]))/2)+gb)});
  });
  // 6 阵技 / 7 劫技：等级取三件均值
  const avg=clampLv(1+Math.floor(total/3)+gb);
  if(a&&b&&c){
    const e=evaluate(G.slots);
    if(e.r1==='生'&&e.r2==='生')
      sk.push({pos:names[5],name:'周天璇玑',kind:'aoe',pow:1.5,desc:'璇玑玉衡，《尚书·舜典》；全体大伤',elem:a.x,grade:5,from:'阵',lv:avg});
    else if(e.r1==='克'&&e.r2==='克')
      sk.push({pos:names[5],name:'煞气冲斗',kind:'aoe',pow:1.3,desc:'剑气冲斗牛，《晋书》；全体伤害，自损一成',elem:b.x,grade:4,from:'阵',selfHurt:0.1,lv:avg});
    else if(a.x===b.x&&b.x===c.x)
      sk.push({pos:names[5],name:'抱元守一',kind:'atk',pow:2.2,desc:'《道德经》抱元守一；单体巨伤',elem:a.x,grade:5,from:'阵',lv:avg});
    else
      sk.push({pos:names[5],name:'乱阵',kind:'atk',pow:1.0,desc:'三才不成章法，只此一击',elem:a.x,grade:2,from:'阵',lv:avg});
    // 劫技：缺的行越多越弱
    const used=new Set([a.x,b.x,c.x]);
    const miss=XING.filter(x=>!used.has(x));
    const p = miss.length===2?2.0: miss.length===3?1.4:1.0;
    sk.push({pos:names[6],name:miss.length?miss.join('')+'之厄':'圆满之厄',kind:'atk',
      pow:p,desc:'劫位之力，缺 '+miss.length+' 行',elem:miss[0]||a.x,grade:5,from:'劫',miss:miss.length,
      lv:clampLv(1+Math.floor(total/3)+gb+ (miss.length===0?1:0))});
  } else {
    sk.push(null); sk.push(null);
  }
  return sk;
}

/* ---------- 技能链接：辅助技挂在主动技上 ---------- */
const isAuxKind = k => k==='heal'||k==='shield'||k==='buff';
const canLink   = k => k==='atk'||k==='aoe';
/* 返回被链接的辅助技（星位会随配装变，取用前都校验类型） */
function auxOf(idx, list){
  const ln=G.links[idx];
  if(ln==null || ln===idx) return null;
  const s=(list||buildSkills())[ln];
  if(!s || !isAuxKind(s.kind)) return null;
  return s;
}
/* 已被别的主动技占用的辅助星位 */
function auxTakenBy(auxIdx){
  for(const k in G.links){ if(G.links[k]===auxIdx) return +k; }
  return null;
}

/* 技能威力：等级每级 +18% */
function skillPower(s, stats, e){
  if(!s) return 0;
  const base = isAuxKind(s.kind) ? stats.mag : stats.atk;
  const lvm = 1 + ((s.lv||1)-1)*0.18;
  return Math.round(base * s.pow * e.total * (1 + (s.grade||1)*0.12) * lvm);
}

const MOBS=['蛊雕','狰','毕方','九婴','罔象','山魈','穷奇','梼杌'];  // 《山海经》《国语》

function makeWave(n){
  // 难度是渐入的：一上来就按满难度算，高难度前几波会直接无解
  const ramp=Math.min(1, 0.4+n*0.075);
  const d=1+(G.diff-1)*ramp;
  const cnt=Math.min(4, 2+Math.floor(n/4));
  const arr=[];
  for(let i=0;i<cnt;i++){
    const hp=Math.round((50+n*18)*d*(0.85+Math.random()*0.35));
    arr.push({
      name:MOBS[Math.floor(Math.random()*MOBS.length)],
      hp,maxhp:hp, atk:Math.round((3.5+n*1.35)*d*10)/10,
      x:0,y:0, hurt:0, hx:0, dead:false, atkAnim:0, def:Math.round(n*0.8*d)
    });
  }
  return arr;
}

/* 把 #rrggbb 转成带透明度的 rgba，光柱要用 */
function hexA(hex,a){
  const n=parseInt(hex.slice(1),16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+Math.max(0,Math.min(1,a))+')';
}
function hitStop(s){ freeze=Math.max(freeze,s); }

function drawBG(){

  g.addColorStop(0,'#14161d'); g.addColorStop(.6,'#1e2028'); g.addColorStop(1,'#2c2a2c');

  const layers=[{c:'#1b1d24',h:110,o:0},{c:'#22242c',h:78,o:40},{c:'#282a30',h:52,o:90}];
  layers.forEach((L,li)=>{
    ctx.fillStyle=L.c; ctx.beginPath(); ctx.moveTo(-40,GROUND);
    for(let i=0;i<=9;i++){
      const bx=-40+i*80+L.o, bh=L.h*(0.6+((i*47+li*31)%70)/100);

    }

  ctx.save(); ctx.globalAlpha=.85;
  ctx.fillStyle='#efe7cd'; ctx.beginPath(); ctx.arc(520,54,16,0,7); ctx.fill();
  ctx.fillStyle='#14161d'; ctx.beginPath(); ctx.arc(527,48,14,0,7); ctx.fill();
  ctx.restore();
  ctx.fillStyle='#241f1a'; ctx.fillRect(0,GROUND,cv.width,16);

  for(let i=0;i<24;i++){
    const x=(i*61+17)%cv.width, h=3+((i*29)%4);
    ctx.fillStyle='#20281f';
    ctx.fillRect(x,GROUND-h,1.5,h); ctx.fillRect(x+3,GROUND-h+1,1.5,h-1);

}

function updateVisual(dt){
  if(shake>0) shake=Math.max(0,shake-dt*2.6);
  if(hitFlash>0) hitFlash=Math.max(0,hitFlash-dt*3);
  if(pHurt>0) pHurt=Math.max(0,pHurt-dt);
  if(pAnim>0) pAnim=Math.max(0,pAnim-dt);
  mobs.forEach(m=>{
    if(m.hurt>0) m.hurt=Math.max(0,m.hurt-dt);
    if(m.hx) m.hx*=Math.pow(0.0009,dt);
    if(m.atkAnim>0) m.atkAnim=Math.max(0,m.atkAnim-dt);
  });
  if(dt>0){
    beams.forEach(b=>{ b.t+=dt; });
    beams=beams.filter(b=>b.t<b.life);
  }
  parts.forEach(p=>{ p.t+=dt; p.vy+=560*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; });
  parts=parts.filter(p=>p.t<p.life);
  floats.forEach(f=>{ f.t+=dt; f.y-=38*dt; });
  floats=floats.filter(f=>f.t<f.life);
}

/* ---------- 掉宝光柱：宝是从地上冒出来的，不是凭空刷在字里 ---------- */
const BEAM_X=[190,330,470];
function spawnBeams(items){
  items.forEach((it,i)=>{
    const g=it.grade, x=BEAM_X[i%3]+(Math.random()-0.5)*14;
    const scale = g===1? 0.55 : 1;
    beams.push({
      x, col:RAR_COL[g], w:(13+g*7)*scale, h:(120+g*46)*scale,
      t:0, life: g>=4? 6.4 : 3.8,
      seed: Math.random()*6.283, g
    });
    burst(x, GROUND-4, 8+g*5, RAR_COL[g]);
  });
  if(beams.length>6) beams=beams.slice(-6);        // 别堆成一堵光墙
  if(items.some(i=>i.grade>=3)) sfx('loot');
}
function drawBeams(){
  if(!beams.length) return;
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  beams.forEach(b=>{
    const k=b.t/b.life;
    const fade = k<0.08 ? k/0.08 : (k>0.74 ? (1-k)/0.26 : 1);
    const grow = Math.min(1, k*6);                     // 拔地而起
    const h = b.h*(0.3+0.7*grow);
    const pulse = 0.86+0.14*Math.sin(b.t*8+b.seed);
    // 凡品只留一缕白烟，好货才有颜色 —— 光柱本身就是稀有度的语言
    const dim = b.g===1? 0.34 : b.g===2? 0.72 : 1;
    const A = fade*pulse*dim;
    const R = b.w;
    const cy = GROUND-h*0.5;

    // 柔边柱体：圆形径向渐变竖着拉长，再裁掉地面以下
    const glow=(rad, alpha)=>{
      ctx.save();
      ctx.beginPath(); ctx.rect(b.x-rad, GROUND-h, rad*2, h); ctx.clip();
      ctx.translate(b.x, cy);
      ctx.scale(1, h/rad);
      const rg=ctx.createRadialGradient(0,0,0, 0,0,rad);
      rg.addColorStop(0,    hexA(b.col, 1.0*alpha));
      rg.addColorStop(0.18, hexA(b.col, 0.80*alpha));
      rg.addColorStop(0.42, hexA(b.col, 0.34*alpha));
      rg.addColorStop(0.70, hexA(b.col, 0.10*alpha));
      rg.addColorStop(1,    hexA(b.col, 0));
      ctx.fillStyle=rg;
      ctx.beginPath(); ctx.arc(0,0,rad,0,7); ctx.fill();
      ctx.restore();
    };
    glow(R*1.7, A*0.34);        // 外晕
    glow(R*0.85, A*0.95);       // 内柱

    // 亮芯
    ctx.fillStyle=hexA('#fff6dc', 0.85*A);
    ctx.fillRect(b.x-1.7, GROUND-h*0.95, 3.4, h*0.95);
    ctx.fillStyle=hexA(b.col, 0.95*A);
    ctx.fillRect(b.x-3.2, GROUND-h*0.55, 6.4, h*0.55);

    // 地面光斑
    ctx.fillStyle=hexA(b.col, 0.7*A);
    ctx.beginPath(); ctx.ellipse(b.x, GROUND+1, R*0.95, R*0.26, 0, 0, 7); ctx.fill();
    ctx.fillStyle=hexA('#fff6dc', 0.55*A);
    ctx.beginPath(); ctx.ellipse(b.x, GROUND+1, R*0.34, R*0.11, 0, 0, 7); ctx.fill();

    // 上升的光尘
    for(let i=0;i<7;i++){
      const ph=((b.t*0.5 + i*0.16 + b.seed)%1);
      const yy=GROUND-ph*h*0.95;
      const xx=b.x+Math.sin((b.t+i*1.7)*2.2+b.seed)*R*0.7;
      ctx.fillStyle=hexA(b.col, (1-ph)*A);
      ctx.fillRect(xx, yy, 2, 2);
    }
  });
  ctx.restore();
}

function render(){
  const sx=(Math.random()-0.5)*shake*18, sy=(Math.random()-0.5)*shake*18;
  ctx.save(); ctx.translate(sx,sy);
  drawBG(); drawBeams(); drawMobs(); drawHero(); drawBottom();
  parts.forEach(p=>{ ctx.globalAlpha=Math.max(0,1-p.t/p.life); ctx.fillStyle=p.c; ctx.fillRect(p.x,p.y,p.s,p.s); });
  ctx.globalAlpha=1;
  floats.forEach(f=>{
    ctx.globalAlpha=Math.max(0,1-Math.pow(f.t/f.life,2));
    ctx.font=(f.big?'bold 22px':'bold 15px')+' monospace';
    ctx.fillStyle=f.c; ctx.textAlign='center'; ctx.fillText(f.txt,f.x,f.y);
  });
  ctx.globalAlpha=1; ctx.textAlign='left';
  if(hitFlash>0){ ctx.fillStyle='rgba(200,40,30,'+(hitFlash*0.25)+')'; ctx.fillRect(0,0,cv.width,cv.height); }
  ctx.restore();
}
let last=0;
function loop(t){
  const raw=Math.min(0.05,(t-last)/1000||0); last=t;
  let dt=raw;
  if(freeze>0){ freeze=Math.max(0,freeze-raw); dt=0; }   // 命中瞬间：整个世界定住几十毫秒
  updateVisual(dt); render(); requestAnimationFrame(loop);
}

/* ---------- 音效 ---------- */
let AC=null;
function sfx(type){
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
    o.connect(g); g.connect(AC.destination);
    if(type==='hit'){o.type='square';o.frequency.setValueAtTime(190,t);o.frequency.exponentialRampToValueAtTime(70,t+.09);g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+.11);o.start(t);o.stop(t+.12);}
    else if(type==='crit'){o.type='sawtooth';o.frequency.setValueAtTime(430,t);o.frequency.exponentialRampToValueAtTime(110,t+.15);g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+.17);o.start(t);o.stop(t+.18);}
    else if(type==='hurt'){o.type='triangle';o.frequency.setValueAtTime(95,t);o.frequency.exponentialRampToValueAtTime(48,t+.15);g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.start(t);o.stop(t+.19);}
    else if(type==='win'){o.type='square';o.frequency.setValueAtTime(320,t);o.frequency.setValueAtTime(480,t+.07);o.frequency.setValueAtTime(640,t+.14);g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.32);}
    else if(type==='heal'){o.type='sine';o.frequency.setValueAtTime(520,t);o.frequency.linearRampToValueAtTime(760,t+.18);g.gain.setValueAtTime(.04,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.start(t);o.stop(t+.24);}
    else if(type==='loot'){o.type='sine';o.frequency.setValueAtTime(280,t);o.frequency.exponentialRampToValueAtTime(880,t+.26);g.gain.setValueAtTime(.045,t);g.gain.exponentialRampToValueAtTime(.001,t+.42);o.start(t);o.stop(t+.44);}
  }catch(e){}
}

/* ---------- 粒子 / 飘字 / 日志 ---------- */
function burst(x,y,n,color){
  for(let i=0;i<n;i++) parts.push({x,y,vx:(Math.random()-0.5)*260,vy:-Math.random()*200-40,life:.5+Math.random()*.3,t:0,c:color,s:2+Math.random()*3});
}
function floatText(x,y,txt,color,big){ floats.push({x,y,txt,c:color,t:0,life:.95,big:!!big}); }
function log(txt,cls){
  G.log.unshift('<div>'+(cls?'<span style="color:'+cls+'">':'')+txt+(cls?'</span>':'')+'</div>');
  if(G.log.length>40) G.log.pop();

/* ---------- 落宝：让"捡到东西"变成看得见的一件事 ---------- */
function lootCard(it){
  const col=RAR_COL[it.grade];
  const unid = it.ident===false;
  let hint='';
  if(unid){
    hint='<span class="hint" style="color:'+col+'">蒙尘 · 待鉴</span>';
  }else if(it.curse){
    hint='<span class="hint" style="color:#c9862f">煞气外溢</span>';
  }else if(it.spirit){
    hint='<span class="hint" style="color:#a58ac0">灵息流转</span>';
  }else if(it.inscr){
    hint='<span class="hint" style="color:#c9a227">铭痕隐现</span>';
  }
  return '<div class="lootcard" style="border-color:'+col+'" onclick="showItem('+it.id+')">'+
    '<b style="color:'+col+'">'+RAR_NAME[it.grade]+'</b>'+
    '<span style="color:#e8dfc9">'+(unid?'未鉴之器':it.name)+'</span>'+hint+'</div>';
}
function showLoot(items){
  const box=document.getElementById('loot');
  box.innerHTML=items.map(lootCard).join('')+box.innerHTML;
  while(box.children.length>5) box.removeChild(box.lastChild);   // 留着，随时点开看
  const top=Math.max.apply(null,items.map(i=>i.grade));
  if(top>=4){ shake=1.0; hitFlash=0.55; sfx('win'); }        // 仙品以上：整屏震一下
  else if(top>=3){ shake=0.6; sfx('crit'); }
}
function clearLoot(){ document.getElementById('loot').innerHTML=''; }

/* ---------- 拾遗录：收集本身就是目标 ---------- */
function registerDex(it){
  const first=!G.dex[it.base];
  if(first) G.dex[it.base]={wave:G.wave, rar:it.grade};
  else G.dex[it.base].rar=Math.max(G.dex[it.base].rar, it.grade);
  if(first){
    const n=Object.keys(G.dex).length;
    log('拾遗录新识：'+it.base+'（'+n+'/30）','#3f7a6a');
    if(n%5===0){
      G.pts++;
      log('拾遗录集齐 '+n+' 器，得经脉点 1。','#8a5a1f');
    }
  }
  return first;
}
function showDex(){
  const got=Object.keys(G.dex).length;
  let html='<h3>拾遗录</h3>'+
    '<p class="sub2">已识 <b style="color:#3f7a6a">'+got+'</b> / 30 器　每集齐 5 器，得 1 点经脉点。</p>';
  XING.forEach(x=>{
    html+='<div style="margin-top:9px;font-size:11px;font-weight:700;color:'+COL[x]+'">'+x+'　行</div><div class="dexgrid">';
    ITEM_NAMES[x].forEach(nm=>{
      const d=G.dex[nm];
      html+='<div class="dexcell'+(d?' got':'')+'" '+(d?'style="border-color:'+RAR_COL[d.rar]+'"':'')+'>'+
        (d? nm : '？')+
        '<div style="font-size:8.5px;font-weight:400;color:'+(d?RAR_COL[d.rar]:'var(--ink2)')+'">'+
        (d? GNAME[d.rar]+' · 波'+d.wave : '未识')+'</div></div>';
    });
    html+='</div>';
  });
  html+='<div class="row"><button onclick="closeModal()">关上</button></div>';
  document.getElementById('modal').innerHTML=html;
  document.getElementById('mask').classList.add('on');
}

/* ---------- 鉴定 ---------- */
function findItem(id){
  return G.bag.find(i=>i.id===id) || G.slots.find(i=>i&&i.id===id);
}
const IDENT_COST=20;
function identify(id){
  const it=findItem(id);
  if(!it||it.ident) return;
  if(G.stones<IDENT_COST){ log('灵石不足（鉴定需 '+IDENT_COST+'）。','#a83b2c'); return; }
  G.stones-=IDENT_COST;
  it.ident=true;
  const parts=[];
  if(it.inscr)  parts.push('铭文「'+it.inscr.n+'」');
  if(it.spirit) parts.push('器灵「'+it.spirit.n+'」');
  if(it.curse)  parts.push('凶咒「'+it.curse.n+'」');
  log('鉴出 '+it.name+'：'+GNAME[it.grade]+'，'+it.affixes.length+' 条词条'+(parts.length?'，'+parts.join('、'):''),
      it.grade>=4?'#7a4a8a':'#a8811f');
  if(it.grade>=4){ shake=0.7; sfx('crit'); }
  registerDex(it);                    // 鉴出来了才算识得
  refresh();
  if(G.autoPick){ if(modalItem===id) showItem(id); return; }
  showItem(id);                       // 鉴完直接把东西摊开给你看
  const md=document.getElementById('modal');
  md.classList.remove('reveal'); void md.offsetWidth; md.classList.add('reveal');
}

/* ---------- 战斗 ---------- */
let php=1;

function startWave(){
  mobs=makeWave(G.wave);
  G.turn=1; G.busy=false; G.over=false;
  const st=calcStats();
  php=st.s.hp; shield=0; buffNext=0; reflect=0;
  log('第 '+G.wave+' 波 · 来了 '+mobs.length+' 只。','#a83b2c');
  refresh();
}

function alive(){ return mobs.filter(m=>!m.dead); }

function castSkill(idx){
  if(G.busy||G.over) return;
  const list=buildSkills();
  const sk=list[idx];
  if(!sk) return;
  const st=calcStats();
  const e=st.e;
  const q=st.q;
  const aux = canLink(sk.kind) ? auxOf(idx, list) : null;
  G.busy=true;
  pAnim=0.3;

  const p=skillPower(sk,st.s,e);
  const targets = sk.kind==='aoe' ? alive() : [alive()[0]].filter(Boolean);
  if(!targets.length){ G.busy=false; return; }

  const healB=1+(q.healB||0)/100;
  const linkMul = aux ? 1 + (aux.lv||1)*0.06 : 1;        // 辅助技等级 → 主攻威力
  const linkBuff = (aux && aux.kind==='buff') ? 1.3 : 1;  // 蓄势类链接：本击 +30%

  // 链接的辅助技随这一招同步触发，按六成强度
  if(aux){
    if(aux.kind==='heal'){
      const h=Math.round(skillPower(aux,st.s,e)*0.9*0.6*healB);
      php=Math.min(st.s.hp, php+h);
      floatText(PLAYER_X, GROUND-120, '链 +'+h, '#6cbb8c');
      log('　链·'+aux.name+'：回气血 '+h, '#2f6b52');
    } else if(aux.kind==='shield'){
      const v=Math.round(skillPower(aux,st.s,e)*0.8*0.6*healB);
      shield+=v;
      floatText(PLAYER_X, GROUND-120, '链 盾 '+v, '#6fa8c9');
      log('　链·'+aux.name+'：护盾 '+v, '#38617f');
    } else {
      floatText(PLAYER_X, GROUND-120, '链 蓄势', '#c9a227');
      log('　链·'+aux.name+'：本击助势 ×1.3', '#a8811f');
    }
  }

  if(sk.kind==='heal'){
    const heal=Math.round(p*0.9*healB);
    php=Math.min(st.s.hp, php+heal);
    floatText(PLAYER_X, GROUND-96, '+'+heal, '#6cbb8c', true);
    burst(PLAYER_X, GROUND-40, 12, '#6cbb8c');
    sfx('heal');
    log(sk.name+' Lv'+sk.lv+'：回气血 '+heal);
  } else if(sk.kind==='shield'){
    const sv=Math.round(p*0.8*healB);
    shield+=sv;
    floatText(PLAYER_X, GROUND-96, '护盾 '+sv, '#6fa8c9', true);
    sfx('heal');
    log(sk.name+' Lv'+sk.lv+'：护盾 '+sv);
  } else if(sk.kind==='buff'){
    buffNext=2;
    floatText(PLAYER_X, GROUND-96, '蓄势', '#c9a227', true);
    sfx('heal');
    log(sk.name+' Lv'+sk.lv+'：下一击威力翻倍');
  } else {
    const doubled = buffNext>0;
    if(doubled) buffNext=0;
    let top=0;
    // 器灵 / 诅咒：整体伤害乘数
    const sp=q.sp;
    let spiritMul = 1 + ((sk.kind==='aoe'? sp.aoe : sp.single)||0)/100;
    if(sp.low && php/st.s.hp < 0.3) spiritMul *= 1+sp.low/100;   // 回天
    if(sp.first && G.turn===1)      spiritMul *= 1+sp.first/100; // 承影
    spiritMul *= 1-(sp.weak||0)/100;                              // 诅咒·耗

    const strike=(m, scale, extra)=>{
      let dmg = p*(0.85+Math.random()*0.3);
      if(sk.kind!=='aoe') dmg*=1.15;
      if(doubled) dmg*=2;
      dmg*=scale*linkMul*linkBuff*spiritMul;
      // 破防：按比例削减目标气防，等效增伤
      dmg*= (1 + (q.pen/100)*0.6);
      const crit = Math.random()*100 < q.crit;
      if(crit) dmg*= (1+q.critDmg/100);
      const v=Math.max(1, Math.round(dmg));
      m.hp-=v; m.hurt=0.16; m.hx=12;
      burst(m.x, m.y-10, crit?16:10, crit?'#ffd166':'#e8b04a');
      floatText(m.x+(Math.random()-0.5)*24, m.y-24-(extra?15:0),
        (extra||'')+(crit?'暴 ':'')+v, crit?'#ffd166':(doubled?'#ffe9a8':'#f0e6c0'), crit||doubled);
      if(crit){ sfx('crit'); shake=Math.max(shake,0.7); }
      top=Math.max(top,v);
      // 噬血
      if(q.leech>0){
        const h=Math.round(v*q.leech/100);
        if(h>0){ php=Math.min(st.s.hp, php+h); floatText(PLAYER_X+(Math.random()-0.5)*18, GROUND-104, '+'+h, '#6cbb8c'); }
      }
      if(m.hp<=0){ m.dead=true; m.hp=0; }
      // 打击停顿：普通 45ms、暴击 85ms、击杀 100ms。整个画面定住一下，手感就出来了
      hitStop(m.dead?0.10:(crit?0.085:0.045));
    };

    targets.forEach(m=>{
      strike(m,1,'');
      // 连击：额外一记半伤
      if(!m.dead && Math.random()*100 < q.dbl){ strike(m,0.55,'连 '); }
    });
    shake=Math.max(shake,0.55); sfx('hit');
    log(sk.name+' Lv'+sk.lv+'：造成约 '+Math.round(p*linkMul*linkBuff*spiritMul)+' 点伤害'+(doubled?'（蓄势×2）':'')+(top?'　最高 '+top:''));
  }

  refresh();

  if(alive().length===0){ winWave(); return; }

  setTimeout(()=>{
    enemyTurn();
  }, 520);
}

function enemyTurn(){
  const st=calcStats();
  const q=st.q;
  alive().forEach((m,i)=>{
    setTimeout(()=>{
      if(m.dead || G.over) return;
      m.atkAnim=0.3;
      let raw=Math.max(1, m.atk - st.s.def*0.5);
      raw=Math.round(raw*(1-q.red/100));   // 减伤
      let d=raw;
      if(shield>0){
        const absorb=Math.min(shield,d);
        shield-=absorb; d-=absorb;
        if(d>0){ php-=d; }
        floatText(PLAYER_X, GROUND-70, absorb?'盾挡 '+absorb:'', '#6fa8c9');
      } else {
        php-=d;
      }
      if(d>0){
        hitFlash=0.45; shake=0.4; pHurt=0.16;
        hitStop(0.035);
        floatText(PLAYER_X+(Math.random()-0.5)*20, GROUND-80, '-'+d, '#e07a6a');
        sfx('hurt');
      }
      // 反伤：按挨到的伤害回敬
      if(q.reflect>0 && raw>0){
        const rf=Math.max(1, Math.round(raw*q.reflect/100));
        m.hp-=rf; m.hurt=0.16;
        burst(m.x, m.y-10, 6, '#9b7ab0');
        floatText(m.x, m.y-30, '反 '+rf, '#9b7ab0');
        if(m.hp<=0){ m.dead=true; m.hp=0; }
      }
      refresh();
      if(php<=0){ php=0; onDeath(); }
    }, i*120);
  });
  setTimeout(()=>{
    if(G.over) return;
    if(alive().length===0){ winWave(); return; }
    // 器灵·不息 / 诅咒·贪：回合末结算
    const sp=calcStats().q.sp;
    if(sp.regen>0){
      const h=Math.round(calcStats().s.hp*sp.regen/100);
      php=Math.min(calcStats().s.hp, php+h);
      floatText(PLAYER_X, GROUND-110, '息 +'+h, '#6cbb8c');
    }
    if(sp.drain>0){
      const dmg=Math.max(1,Math.round(calcStats().s.hp*sp.drain/100));
      php-=dmg;
      floatText(PLAYER_X, GROUND-88, '蚀 -'+dmg, '#a83b2c');
      if(php<=0){ php=0; onDeath(); return; }
    }
    if(buffNext>0) buffNext--;
    G.turn++;
    G.busy=false;
    refresh();
  }, alive().length*120+420);
}

function winWave(){
  G.over=true;
  sfx('win'); shake=0.8;
  burst(400,GROUND-60,40,'#c9a227');
  floatText(320,140,'破阵','#ffd166',true);
  const st=calcStats();
  php=Math.min(st.s.hp, php+Math.round(st.s.hp*0.3));
  G.best=Math.max(G.best,G.wave);
  const gain=Math.round((8+G.wave*4)*G.diff);      // 难度越高，灵石给得越多
  G.stones+=gain;
  // 落宝：稳压两件，另有几率多掉一件
  const drops=[makeItem(G.wave), makeItem(G.wave)];
  if(Math.random()<0.22) drops.push(makeItem(G.wave));
  // 未鉴的先不进拾遗录 —— 鉴出来才算「识得此器」
  drops.forEach(it=>{ G.bag.push(it); if(it.ident!==false) registerDex(it); });
  spawnBeams(drops);                    // 宝从地里冒出来
  showLoot(drops);
  log('破阵！得 '+drops.map(d=>nmOf(d)).join('、')+'，灵石 +'+gain,'#2f6b52');
  const relic = (G.wave%5===0);
  G.wave++;
  // 修为：破阵涨修为，满一级升境界、给 1 点经脉点
  const xg=12+G.wave*4;
  G.xp+=xg;
  let ups=0;
  while(G.xp>=xpNeed(G.lv)){ G.xp-=xpNeed(G.lv); G.lv++; G.pts++; ups++; }
  if(ups) log('修为 +'+xg+'　境界升至 Lv'+G.lv+'，得经脉点 '+ups+'。','#8a5a1f');
  else log('修为 +'+xg+'（'+G.xp+'/'+xpNeed(G.lv)+'）','#6b6154');
  if(location.search.includes('auto')) autoEquip();
  refresh();
  if(relic){                                   // 每五波：三选一，让你自己挑这一口
    setTimeout(()=>{ showRelic(); }, 620);
    return;
  }
  setTimeout(()=>{
    if(G.over===false) return;
    startWave();
  },1400);
}

/* ---------- 拾遗 · 三选一 ---------- */
const RELICS=[
  {k:'item',  n:'天赐宝光', d:'一件宝品之器，三成是仙品。捡到时仍是蒙尘的。', c:'#a8811f'},
  {k:'soul',  n:'器魂灌注', d:'得器魂 16 —— 够淬两三回火了。',              c:'#7a4a8a'},
  {k:'stone', n:'前朝遗银', d:'得灵石 120。',                                c:'#3f7a6a'},
  {k:'mer',   n:'残穴图',   d:'得 1 点经脉点。',                             c:'#a83b2c'},
  {k:'quench',n:'地火余温', d:'三才上最弱的一条词条，白提一档。',            c:'#c9862f'},
  {k:'dex',   n:'古器名录', d:'随机识得一件未见之器，并直接到手。',          c:'#5b7c96'},
];
let relicOpen=false;

function showRelic(){
  if(relicOpen || G.over===false) return;
  const pick=RELICS.slice();
  for(let i=pick.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=pick[i]; pick[i]=pick[j]; pick[j]=t; }
  const three=pick.slice(0,3);
  let html='<h3>拾　遗</h3>'+
    '<p class="sub2">第 '+(G.wave-1)+' 波既破，天地间掉下三样东西。只能拿一样。</p>'+
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px">';
  three.forEach((r,i)=>{
    html+='<div class="relic" style="border-color:'+r.c+'" onclick="takeRelic('+i+')">'+
      '<div style="font-size:13.5px;font-weight:800;letter-spacing:3px;color:'+r.c+'">'+r.n+'</div>'+
      '<div style="font-size:10.5px;color:var(--ink2);line-height:1.65;margin-top:6px">'+r.d+'</div>'+
      '<div class="take" style="color:'+r.c+'">取　之</div></div>';
  });
  html+='</div>';
  relicOpen=true;
  window.__relic=three;
  openModal(html);
  if(G.autoPick) setTimeout(()=>takeRelic(Math.floor(Math.random()*3)), 400);
}

function takeRelic(i){
  const r=(window.__relic||[])[i];
  if(!r) return;
  relicOpen=false; window.__relic=null;
  closeModal();
  if(r.k==='item'){
    const it=makeItem(G.wave, false, Math.random()<0.3?4:3);
    G.bag.push(it);
    log('宝光落地：'+RAR_NAME[it.grade]+'，器身蒙尘。','#a8811f');
  } else if(r.k==='soul'){
    G.soul+=16; log('器魂 +16（共 '+G.soul+'）。','#7a4a8a');
  } else if(r.k==='stone'){
    G.stones+=120; log('灵石 +120（共 '+G.stones+'）。','#3f7a6a');
  } else if(r.k==='mer'){
    G.pts++; log('得经脉点 1（共 '+G.pts+'）。','#a83b2c');
  } else if(r.k==='quench'){
    let best=null, bi=null;
    G.slots.forEach(it=>{
      if(!it||it.ident===false) return;
      it.affixes.forEach(a=>{
        const c=quenchCost(a.t);
        if(c && a.t>1 && (!best || a.t>best.t)){ best=a; bi=it; }
      });
    });
    if(best){
      const from=best.t; reTier(best, best.t-1);
      log('地火：'+bi.name+' 的 '+afDef(best).n+' T'+from+' → T'+best.t+'。','#c9862f');
    } else {
      G.soul+=20; log('三才上已无可淬之物，化作器魂 +20。','#7a4a8a');
    }
  } else if(r.k==='dex'){
    const miss=[];
    XING.forEach(x=>ITEM_NAMES[x].forEach(nm=>{ if(!G.dex[nm]) miss.push({x,nm}); }));
    if(miss.length){
      const m=miss[Math.floor(Math.random()*miss.length)];
      const idx=ITEM_NAMES[m.x].indexOf(m.nm);
      let it=null;
      for(let t=0;t<60;t++){
        const c=makeItem(G.wave,false,Math.min(5,Math.max(3,Math.round(idx/1.2)+2)));
        if(c.base===m.nm){ it=c; break; }
      }
      if(!it){ it=makeItem(G.wave,false,4); }
      it.base=m.nm; it.name=m.nm+(it.broken?'·残':'')+'·'+it.y+it.x; it.ident=true;
      G.bag.push(it); registerDex(it);
      log('名录所载：'+m.nm+' 现世。','#5b7c96');
    } else {
      G.soul+=20; log('名录已满，化作器魂 +20。','#7a4a8a');
    }
  }
  startWave();
}

function effectGrade(it){ return effGrade(it); }

function onDeath(){
  if(G.over) return;
  G.over=true;
  sfx('hurt');
  document.getElementById('modal').innerHTML=
    '<h3>道消</h3>'+
    '<p>第 <b>'+G.wave+'</b> 波，第 <b>'+G.turn+'</b> 回合倒下。最高 <b>'+G.best+'</b> 波。</p>'+
    '<p class="tip">装备都留着。回去看看是不是气血太薄，或者技能威力不够。</p>'+
    '<div class="row"><button onclick="restart()">重整旗鼓</button></div>';
  document.getElementById('mask').classList.add('on');
  refresh();
}

function restart(){
  closeModal();
  G.wave=1;
  startWave();
}

/* ---------- 熔炉：铸（赌） / 淬（稳） / 引（定向） ---------- */
/* 打造的核心不是点一下变强，而是「拿有限的东西去换你想要的形状」 */
const CAST_COST=25;                              // 铸：随机生一条
const GUIDE={s:70,o:10,t:3};                     // 引：定点生一条，固定 T3
function quenchCost(t){                          // 淬：把 T t 提到 T(t-1)
  const m={5:[20,2],4:[32,3],3:[50,5],2:[80,8]};
  const x=m[t]; return x? {s:x[0],o:x[1]} : null;
}

function salvage(id){
  const i=G.bag.findIndex(x=>x.id===id);
  if(i<0){ log('三才上的器，先卸下才拆得动。','#a83b2c'); return; }
  const it=G.bag[i];
  if(it.grade>=3 && !confirm('拆掉「'+nmOf(it)+'」？词条、铭文、器灵都会化成器魂，不可复原。')) return;
  const n=soulOf(it);
  G.soul+=n; G.bag.splice(i,1);
  log('拆解 '+nmOf(it)+'，得器魂 '+n+'。','#7a4a8a');
  if(modalItem===id) closeModal();
  refresh();
}

function salvageJunk(){
  const junk=G.bag.filter(i=>i.ident!==false && i.grade===1);
  if(!junk.length){ log('行囊里没有凡品可拆。','#a83b2c'); return; }
  let s=0;
  junk.forEach(i=>{ s+=soulOf(i); G.bag.splice(G.bag.indexOf(i),1); });
  G.soul+=s;
  log('拆去凡品 '+junk.length+' 件，得器魂 '+s+'。','#7a4a8a');
  refresh();
}

function forge(id,mode,arg){
  const it=findItem(id);
  if(!it || it.ident===false) return;

  if(mode==='c'){                                  // 铸
    if(it.affixes.length>=6 || !freeKind(it)){ log('前缀后缀都满了，铸不进去。','#a83b2c'); return; }
    if(G.stones<CAST_COST){ log('灵石不足（铸需 '+CAST_COST+'）。','#a83b2c'); return; }
    G.stones-=CAST_COST;
    const kind=freeKind(it);
    const a=rollAffix(effGrade(it), kind, it.x);
    it.affixes.push(a);
    log('铸 '+it.name+'：成词「'+afDef(a).n+' +'+a.v+afUnit(a)+'」T'+a.t+(a.t<=2?'，是条好词条。':'。'),'#a8811f');
    if(it.broken && Math.random()<0.5){
      it.broken=false; it.name=it.name.replace('·残','');
      log('炉火恰好，'+it.base+' 的裂口合上了。','#a8811f');
    }

  } else if(mode==='q'){                           // 淬
    const a=it.affixes[arg];
    if(!a || a.t<=1) return;
    const c=quenchCost(a.t);
    if(!c) return;
    if(G.stones<c.s || G.soul<c.o){ log('淬火不足（需 '+c.s+' 灵石 + '+c.o+' 器魂）。','#a83b2c'); return; }
    G.stones-=c.s; G.soul-=c.o;
    const from=a.t; reTier(a, a.t-1);
    log('淬 '+it.name+'：'+afDef(a).n+' T'+from+' → T'+a.t+'。','#a8811f');

  } else if(mode==='g'){                           // 引
    const def=PRE[arg]||SUF[arg];
    if(!def) return;
    const kind=PRE[arg]?'pre':'suf';
    if(kind==='pre' && cntPre(it)>=3){ log('前缀满了，引不进。','#a83b2c'); return; }
    if(kind==='suf' && cntSuf(it)>=3){ log('后缀满了，引不进。','#a83b2c'); return; }
    if(G.stones<GUIDE.s || G.soul<GUIDE.o){ log('引器不足（需 '+GUIDE.s+' 灵石 + '+GUIDE.o+' 器魂）。','#a83b2c'); return; }
    G.stones-=GUIDE.s; G.soul-=GUIDE.o;
    const a={kind,k:arg,t:GUIDE.t,v:def.v[5-GUIDE.t]};
    it.affixes.push(a);
    log('引 '+it.name+'：定向引出「'+def.n+' +'+a.v+(def.u||'')+'」T'+a.t+'。','#8a5a1f');
  }

  refresh();
  if(modalItem===id) showForge(id);
}

/* ---------- 弹层：单件装备详情 ---------- */
let modalItem=null;
function openModal(html){
  document.getElementById('modal').innerHTML=html;
  document.getElementById('mask').classList.add('on');
}

function showItem(id){
  const it=findItem(id);
  if(!it){ closeModal(); return; }
  modalItem=id;
  const inSlot=G.slots.indexOf(it);
  const col=RAR_COL[it.grade];

  /* —— 未鉴：什么都不给看，只给品级 —— */
  if(it.ident===false){
    openModal(
      '<h3 style="color:'+col+'">未鉴之器　<span class="tag" style="color:'+col+'">'+RAR_NAME[it.grade]+'</span></h3>'+
      '<p>器身蒙尘，年月不可辨。只看气机，是件'+RAR_NAME[it.grade]+'。</p>'+
      '<div class="unkrow">'+new Array(RAR_AFFIX[it.grade]).fill('<i>？</i>').join('')+'</div>'+
      '<p class="tip">鉴定之后才知道：它是哪一件古器、属哪一行、带几条词条，'+
        '有没有铭文、有没有器灵 —— 又或者，带着摘不掉的凶咒。</p>'+
      '<div class="row">'+
        '<button onclick="identify('+it.id+')">鉴定 · '+IDENT_COST+' 灵石</button>'+
        '<button onclick="closeModal();sellItem('+it.id+')">卖出 '+sellPrice(it)+'</button>'+
        '<button onclick="closeModal()">关上</button></div>');
    return;
  }

  /* —— 已鉴 —— */
  let html='<h3 style="color:'+col+'">'+it.name+
    '　<span class="tag" style="color:'+col+'">'+RAR_NAME[it.grade]+'</span></h3>'+
    '<p>'+it.x+'行 · '+it.y+' · 词条 '+it.affixes.length+' / 6（前 '+cntPre(it)+' · 后 '+cntSuf(it)+'）'+

    (inSlot>=0?'　<b style="color:var(--jade)">已佩「'+['天','人','地'][inSlot]+'位」</b>':'')+'</p>';

    it.affixes.forEach(a=>{
      const d=afDef(a);
      html+='<div class="afrow"><span style="color:'+d.c+'">'+d.n+' +'+a.v+afUnit(a)+
        '<span style="color:'+TIERC[a.t-1]+';font-weight:700"> T'+a.t+'</span></span>'+
        '<span class="k">'+(a.kind==='pre'?'前缀':'后缀')+'</span></div>';

    html+='<div class="sec">铭　文</div>'+

    html+='<div class="sec">器　灵</div>'+
      '<div class="modrow" style="color:#7a4a8a"><b>「'+it.spirit.n+'」</b>　'+it.spirit.d+'</div>';
  }
  if(it.curse){
    html+='<div class="sec">凶　咒</div>'+
      '<div class="modrow" style="color:#a83b2c"><b>「'+it.curse.n+'」</b>　'+it.curse.d+
      '　<span style="font-size:10px;opacity:.75">摘不掉</span></div>';
  }

  html+='<div class="val"><span>卖出 '+sellPrice(it)+' 灵石</span>'+
    (inSlot<0?'<span>拆解 +'+soulOf(it)+' 器魂</span>':'')+
    '<span>引器 '+GUIDE.s+' 石 · 淬火 20 石起</span></div>';

  html+='<div class="row">'+
    (inSlot>=0
      ? '<button onclick="closeModal();unequip('+inSlot+')">卸下</button>'
      : '<button onclick="closeModal();equipFromBag('+it.id+')">佩上三才</button>')+
    '<button onclick="showForge('+it.id+')" style="border-color:#8a5a1f">开　炉</button>'+
    (inSlot<0?'<button onclick="salvage('+it.id+')">拆解</button>':'')+
    '<button onclick="closeModal();sellItem('+it.id+')">卖出</button>'+
    '<button onclick="closeModal()">关上</button></div>';
  openModal(html);
}

/* ---------- 弹层：熔炉 ---------- */
function showForge(id){
  const it=findItem(id);
  if(!it){ closeModal(); return; }
  modalItem=id;
  const col=RAR_COL[it.grade];

  if(it.ident===false){
    openModal('<h3>熔炉</h3><p>未鉴之物进炉，只会烧成一堆灰。</p>'+
      '<div class="row"><button onclick="showItem('+it.id+')">回去鉴</button>'+
      '<button onclick="closeModal()">关上</button></div>');
    return;
  }

  const full = it.affixes.length>=6 || !freeKind(it);
  let html='<h3 style="color:'+col+'">熔炉 · '+it.name+'</h3>'+
    '<p>灵石 <b>'+G.stones+'</b>　器魂 <b style="color:#7a4a8a">'+G.soul+'</b>　'+
    '词条 '+it.affixes.length+'/6（前 '+cntPre(it)+' · 后 '+cntSuf(it)+'）</p>';

  /* 淬 */
  html+='<div class="sec">淬 · 提一档（你自己挑哪条）</div>';
  if(!it.affixes.length){
    html+='<div class="sub2">还没有词条，先铸。</div>';
  } else {
    it.affixes.slice().sort((a,b)=>b.t-a.t).forEach(a=>{
      const d=afDef(a), idx=it.affixes.indexOf(a), c=quenchCost(a.t);
      if(!c){
        html+='<div class="row2"><span>'+d.n+' +'+a.v+afUnit(a)+
          ' <span style="color:'+TIERC[a.t-1]+';font-weight:700">T1</span></span>'+
          '<span class="sub2">已至顶</span></div>';
        return;
      }
      const ok=G.stones>=c.s && G.soul>=c.o;
      html+='<div class="row2"><span>'+d.n+' +'+a.v+afUnit(a)+
        ' <span style="color:'+TIERC[a.t-1]+';font-weight:700">T'+a.t+'</span>'+
        ' <span class="sub2">→</span> '+
        '<span style="color:'+TIERC[a.t-2]+';font-weight:700">T'+(a.t-1)+'</span></span>'+
        '<button class="sm" '+(ok?'':'disabled')+' onclick="forge('+it.id+',\'q\','+idx+')">'+c.s+'石 + '+c.o+'魂</button></div>';
    });
  }

  /* 铸 */
  html+='<div class="sec">铸 · 随机生一条（赌 T 级）</div>'+
    '<div class="row2"><span class="sub2">品级越高，越容易铸出高 T</span>'+
    '<button class="sm" '+((!full&&G.stones>=CAST_COST)?'':'disabled')+' onclick="forge('+it.id+',\'c\')">'+
    (full?'词条已满':'铸 · '+CAST_COST+' 石')+'</button></div>';

  /* 引 */
  const have=new Set(it.affixes.map(a=>a.k));
  let picks='';
  PREK.concat(SUFK).forEach(k=>{
    if(have.has(k)) return;
    const isPre=!!PRE[k];
    if(isPre && cntPre(it)>=3) return;
    if(!isPre && cntSuf(it)>=3) return;
    const d=PRE[k]||SUF[k];
    const ok=!full && G.stones>=GUIDE.s && G.soul>=GUIDE.o;
    picks+='<button class="sm" '+(ok?'':'disabled')+' onclick="forge('+it.id+',\'g\',\''+k+'\')">'+d.n+'</button>';
  });
  html+='<div class="sec">引 · 定向指定（固定 T'+GUIDE.t+'）</div>'+
    '<div class="row2"><span class="sub2">'+GUIDE.s+' 灵石 + '+GUIDE.o+' 器魂。技阶引不出来，那是天给的。</span></div>'+
    '<div class="pickgrid">'+(picks||'<span class="sub2">没有能引的词条了</span>')+'</div>';

  html+='<div class="row"><button onclick="showItem('+it.id+')">看详情</button>'+
    (G.slots.indexOf(it)<0?'<button onclick="salvage('+it.id+')">拆解 +'+soulOf(it)+'</button>':'')+
    '<button onclick="closeModal()">关上</button></div>';
  openModal(html);
}

/* ---------- 配装 ---------- */
function equipFromBag(id){
  const i=G.bag.findIndex(x=>x.id===id);
  if(i<0) return;
  const it=G.bag[i];
  if(it.ident===false){                       // 蒙尘之器连五行都不明，配不进三才
    log('蒙尘之器，不知五行，佩不进三才 —— 先鉴。','#a83b2c');
    showItem(it.id);
    return;
  }
  const empty=G.slots.findIndex(s=>!s);
  if(empty<0){ log('三才位已满，先卸一件。','#a83b2c'); return; }
  G.slots[empty]=it; G.bag.splice(i,1);
  refresh();
}
function unequip(i){
  const it=G.slots[i];
  if(!it) return;
  G.slots[i]=null; G.bag.push(it);
  refresh();
}
function sellItem(id){
  const i=G.bag.findIndex(x=>x.id===id);
  if(i<0){ log('佩在身上的先卸下。','#a83b2c'); return; }
  const it=G.bag[i];
  const p=sellPrice(it);
  G.stones+=p; G.bag.splice(i,1);
  log('卖出 '+nmOf(it)+'，得 '+p+' 灵石。');
  if(modalItem===id) closeModal();
  refresh();
}

/* ---------- 设置 ---------- */
function setDiff(){
  G.diff=parseFloat(document.getElementById('diff').value);
  if(mobs.length && !G.over){
    const w=makeWave(G.wave);
    mobs.forEach((m,i)=>{ if(w[i]){ m.maxhp=w[i].maxhp; m.hp=Math.min(m.hp,w[i].maxhp); m.atk=w[i].atk; } });
  }
  refresh();
}

  const mulEl=document.getElementById('mul');
  mulEl.textContent='×'+e.total.toFixed(2);
  mulEl.style.color=e.total>=4?'var(--gold)':e.total>=2?'var(--jade)':e.total>=1?'var(--ink)':'var(--cin)';
  document.getElementById('rels').innerHTML = e.partial? '需三件成阵'
    : (e.r1+' → '+e.r2) + (e.total<1? ' <b style="color:var(--cin)">相克压制，换掉克位</b>':'');
  document.getElementById('school').textContent=(()=>{
    if(e.partial) return '未成阵';
    const {r1,r2}=e;
    if(r1==='生'&&r2==='生') return '周天三生链';
    if(r1==='克'&&r2==='生') return '煞爆流';
    if(r1==='克'&&r2==='克') return '魔道·双滞';
    if(r1==='生'&&r2==='克') return '先扬后抑';
    if(r1==='克'||r2==='克') return '蓄煞·残应';
    if(r1==='比和'&&r2==='比和') return '一元纯体';
    if(r1==='生'||r2==='生') return '单生·正宗';
    return '反哺·守御';
  })();
  document.getElementById('school').style.color=e.total>=4?'var(--gold)':e.total>=2?'var(--jade)':'var(--ink2)';

  // 属性
  const QL=[['crit','暴击',5,'%'],['critDmg','暴伤',50,'%'],['inc','增伤',0,'%'],['red','减伤',0,'%'],
            ['leech','噬血',0,'%'],['reflect','反伤',0,'%'],['pen','破防',0,'%'],['dbl','连击',0,'%'],

    if(v<=base) return;                     // 没长出来就不占位置
    qh+='<div><span>'+n+'</span><b style="color:var(--gold)">'+Math.round(v)+u+'</b></div>';
  });
  document.getElementById('attrs').innerHTML=
    '<div><span>气血</span><b>'+Math.round(st.s.hp)+'</b></div>'+
    '<div><span>攻击</span><b>'+Math.round(st.s.atk)+'</b></div>'+
    '<div><span>法攻</span><b>'+Math.round(st.s.mag)+'</b></div>'+
    '<div><span>防御</span><b>'+Math.round(st.s.def)+'</b></div>'+qh;

  // 七星
  const skBox=document.getElementById('skills'); skBox.innerHTML='';

  Object.keys(G.links).forEach(k=>{
    const a2=sk[G.links[k]], m2=sk[k];
    if(!a2||!isAuxKind(a2.kind)||!m2||!canLink(m2.kind)) delete G.links[k];
  });
  const stars=['★','★★','★★★','★★★★','★★★★★','★★★★★★','★★★★★★★'];
  const STARS=['天枢','天璇','天玑','天权','玉衡','开阳','摇光'];

    skBox.innerHTML='<div style="grid-column:1/3;text-align:center;color:var(--ink2);font-size:11.5px;padding:12px 0">'+
      '三才未成阵，七星不显。<br>点行囊里的「佩」，先装上三件。</div>';
  }
  sk.forEach((s,i)=>{
    const d=document.createElement('div');
    if(!s){ d.className='sk dis'; d.innerHTML='<div class="nm">'+STARS[i]+'</div><div class="ds">未成</div>'; skBox.appendChild(d); return; }
    const pw=skillPower(s,st.s,e);
    d.className='sk'+(G.busy?' dis':'');

    const a2 = canLink(s.kind) ? auxOf(i,sk) : null;
    const linkMul = a2 ? (1+(a2.lv||1)*0.06) * (a2.kind==='buff'?1.3:1) : 1;

    if(canLink(s.kind)){
      linkRow='<div class="lk" data-lk="1" onclick="event.stopPropagation();pickLink('+i+')">'+

    } else if(isAuxKind(s.kind)){
      const taker=auxTakenBy(i);
      linkRow='<div class="lk dim">辅助'+(taker!=null? ' · 挂于'+STARS[taker] : ' · 可被链')+'</div>';
    }
    d.innerHTML='<div class="nm"><span>'+s.name+' <span class="lv">Lv'+s.lv+'</span></span><span class="star">'+stars[i]+'</span></div>'+
      '<div class="ds">'+s.pos+' · '+s.from+' · '+(s.elem||'')+'</div>'+
      '<div class="ds">'+s.desc+'</div>'+
      '<div class="pw">约 '+Math.round(pw*linkMul)+' 点'+(s.kind==='heal'?'回复':s.kind==='buff'?'增益':s.kind==='shield'?'护盾':'伤害')+
        (a2?'<span style="color:#8a5a1f;font-weight:400">（含链）</span>':'')+'</div>'+
      linkRow;
    d.onclick=()=>castSkill(i);
    skBox.appendChild(d);
  });

  // 行囊：先按"要不要动手"排 —— 待鉴的顶到前面，再按品级、词条强弱
  const bag=document.getElementById('bag'); bag.innerHTML='';
  const unidCnt=G.bag.filter(i=>i.ident===false).length;
  document.getElementById('bagcnt').textContent='（'+G.bag.length+'）'+(unidCnt?' 待鉴 '+unidCnt:'');
  const tvSum=it=>it.affixes.reduce((a,x)=>a+(6-x.t),0);
  const sorted=G.bag.slice().sort((a,b)=>{
    const ua=a.ident===false?1:0, ub=b.ident===false?1:0;
    if(ua!==ub) return ub-ua;
    if(a.grade!==b.grade) return b.grade-a.grade;
    const d=tvSum(b)-tvSum(a);
    if(d) return d;
    return effGrade(b)-effGrade(a);
  });
  sorted.forEach(it=>{

    const col=RAR_COL[it.grade];

    d.className='item'+(it.broken?' broken':'')+(unid?' unid':'');

      d.innerHTML='<div class="rar" style="color:'+col+'">'+RAR_NAME[it.grade]+'</div>'+

        '<div class="nm">未鉴之器</div>'+
        '<div class="n">不知何物</div>'+
        '<div class="act">'+
          '<button class="sm" onclick="event.stopPropagation();identify('+it.id+')">鉴 '+IDENT_COST+'</button>'+

    } else {
      d.title=it.name+'　'+RAR_NAME[it.grade]+(it.broken?'（残）':'')+'\n'+afText(it);
      const afs=it.affixes.slice(0,3).map(a=>afLabel(a)).join('<br>');
      const more=it.affixes.length>3?'<div style="color:var(--ink2)">…还有 '+(it.affixes.length-3)+' 条</div>':'';
      let bd='';
      if(it.inscr)  bd+='<i class="b1">铭'+it.inscr.n+'</i>';
      if(it.spirit) bd+='<i class="b2">灵'+it.spirit.n+'</i>';
      if(it.curse)  bd+='<i class="b3">咒'+it.curse.n+'</i>';
      d.innerHTML='<div class="rar" style="color:'+col+'">'+RAR_NAME[it.grade]+'</div>'+
        '<div class="el" style="color:'+COL[it.x]+';margin-top:6px">'+it.x+'</div>'+
        '<div class="nm">'+(it.base||it.x)+'</div>'+
        '<div class="n">'+it.y+it.x+(it.broken?' · 残':'')+'</div>'+
        '<div class="af">'+(afs||'<span style="color:var(--ink2)">无词条</span>')+more+'</div>'+
        (bd?'<div class="bd">'+bd+'</div>':'')+
        '<div class="act">'+
          '<button class="sm" onclick="event.stopPropagation();equipFromBag('+it.id+')">佩</button>'+

          '<button class="sm" onclick="event.stopPropagation();salvage('+it.id+')">拆</button>'+
        '</div>';
    }
    d.onclick=()=>showItem(it.id);
    bag.appendChild(d);
  });
  if(!G.bag.length) bag.innerHTML='<div class="sub2">行囊空。打赢一波掉两件。</div>';
}

/* ---------- 经脉弹层 ---------- */
const STARS=['天枢','天璇','天玑','天权','玉衡','开阳','摇光'];
function merState(nd){
  const lv=G.mer[nd.id]||0;
  if(lv>=2) return 'deep';
  if(lv===1) return 'on';
  if(nd.req && !G.mer[nd.req]) return 'lock';
  return 'ready';
}
function onNode(id){
  const nd=MER.find(n=>n.id===id);
  if(!nd) return;
  const lv=G.mer[id]||0;
  if(lv>=2) return;
  if(lv===0 && nd.req && !G.mer[nd.req]){ log('先通「'+MER.find(n=>n.id===nd.req).n+'」。','#a83b2c'); return; }
  if(G.pts<=0){ log('经脉点不够。破阵涨修为，升级给 1 点。','#a83b2c'); return; }
  G.pts--; G.mer[id]=lv+1;
  php=Math.min(php, calcStats().s.hp);
  log((lv===0? '通':'淬')+nd.n+'：'+nd.d+(lv===0?'':'（大成 ×1.8）'),'#8a5a1f');
  refresh(); showMeridian();
}
function showMeridian(){
  const litN=MER.filter(n=>G.mer[n.id]).length;
  const deepN=MER.filter(n=>G.mer[n.id]>=2).length;
  let lines='', nodes='';
  MER.forEach(nd=>{
    if(!nd.req) return;
    const p=MER.find(n=>n.id===nd.req), on=!!G.mer[nd.id];
    lines+='<line x1="'+p.x+'" y1="'+p.y+'" x2="'+nd.x+'" y2="'+nd.y+'" stroke="'+(on?'#8a5a1f':'#d9d0b8')+
      '" stroke-width="'+(on?2.6:1.4)+'"'+(on?'':' stroke-dasharray="3 3"')+'/>';
  });
  MER.forEach(nd=>{
    const st=merState(nd);
    const on=(st==='on'||st==='deep');
    const ready=(st==='ready'||st==='on') && G.pts>0;   // 已通还能再淬一次
    const deep=st==='deep';
    const fill=deep?'#5c3a10':st==='on'?'#8a5a1f':(ready?'#fffdf7':'#e7dcc2');
    const scol=deep?'#a8811f':st==='on'?'#5c3a10':(ready?'#8a5a1f':'#c3b795');
    const right=nd.x>170;
    const lx=right? nd.x+11 : nd.x-11;
    const anc=right?'start':'end';
    const tip=nd.n+'　'+nd.d+(deep?'（大成）':st==='on'?'（已通，可再淬）':
      st==='lock'?'（需先通'+MER.find(n=>n.id===nd.req).n+'）':'（需 1 点）');
    nodes+='<g class="node'+(ready?' on':'')+'" '+(ready?'onclick="onNode(\''+nd.id+'\')"':'')+'>'+
      '<title>'+tip+'</title>'+
      (deep?'<circle cx="'+nd.x+'" cy="'+nd.y+'" r="10" fill="none" stroke="#a8811f" stroke-width="1.6"/>':'')+
      '<circle cx="'+nd.x+'" cy="'+nd.y+'" r="7" fill="'+fill+'" stroke="'+scol+'" stroke-width="'+(st==='on'&&ready?'2.6':'2')+'"/>'+
      (on?'<circle cx="'+nd.x+'" cy="'+nd.y+'" r="2.6" fill="'+(deep?'#e8c06a':'#f4efe2')+'"/>':'')+
      '<text x="'+lx+'" y="'+(nd.y+3.2)+'" text-anchor="'+anc+'" font-size="9" fill="'+
        (deep?'#a8811f':on?'#5c3a10':ready?'#8a5a1f':'#9a9077')+'" font-family="PingFang SC,monospace"'+
        ' stroke="#faf6ea" stroke-width="2.6" paint-order="stroke" stroke-linejoin="round">'+nd.n+'</text>'+
      '</g>';
  });
  const body=
    '<svg viewBox="0 0 320 460" width="320" height="460" style="display:block">'+
      '<g fill="#e4d9bd" stroke="#bfae8a" stroke-width="1.3" stroke-linejoin="round">'+
        '<circle cx="160" cy="62" r="26"/>'+
        '<rect x="151" y="84" width="18" height="14"/>'+
        '<path d="M118 100 Q160 90 202 100 L194 176 Q188 216 190 252 L130 252 Q132 216 126 176 Z"/>'+
        '<path d="M118 102 L103 114 L95 178 L110 183 L123 126 Z"/>'+
        '<path d="M202 102 L217 114 L225 178 L210 183 L197 126 Z"/>'+
        '<path d="M131 250 L124 404 L147 404 L152 250 Z"/>'+
        '<path d="M169 250 L173 404 L196 404 L189 250 Z"/>'+
      '</g>'+
      lines+nodes+
    '</svg>';

  let list='';
  MER.forEach(nd=>{
    const lv=G.mer[nd.id]||0;
    if(!lv) return;
    const d=lv>=2? nd.d.replace(/([+\d.]+)/, m=>'+'+Math.round(parseFloat(m)*1.8)) : nd.d;
    list+='<div class="mrow"><span>'+nd.n+(lv>=2?' <span style="color:#a8811f;font-size:10px">大成</span>':'')+
      '</span><b style="color:#8a5a1f">'+d+'</b></div>';
  });
  document.getElementById('modal').innerHTML=
    '<h3>经脉图</h3>'+
    '<div class="merbar">境界 <b>Lv'+G.lv+'</b>'+
      '<div class="xpbar"><i style="width:'+Math.min(100,G.xp/xpNeed(G.lv)*100)+'%"></i></div>'+
      '<span class="sub2">'+G.xp+' / '+xpNeed(G.lv)+'</span>'+
      '<span style="margin-left:auto">可点 <b style="color:#8a5a1f">'+G.pts+'</b> 点 · 已通 '+litN+' / '+MER.length+
      ' · 大成 '+deepN+'</span></div>'+
    '<div class="merwrap"><div class="merbody">'+body+'</div>'+
      '<div class="merinfo">'+
        '<h4>已通</h4>'+(list||'<div class="sub2">尚未通任何经脉。先点「会阴」。</div>')+
        '<h4>怎么得点</h4><div class="sub2">破阵涨修为，修为满一级，境界 +1，得 1 点经脉点。<br>'+
        '已通的穴还能再点一次「大成」，效果 ×1.8。<br>经脉加成是永久的，重开一局会清空。</div>'+
      '</div></div>'+
    '<div class="row"><button onclick="closeModal()">关上</button></div>';
  document.getElementById('mask').classList.add('on');
}

/* ---------- 技能链接弹层 ---------- */
function setLink(m,n){
  if(n==null) delete G.links[m]; else G.links[m]=n;
  closeModal(); refresh();
}
function pickLink(mainIdx){
  const sk=buildSkills();
  const main=sk[mainIdx];
  if(!main||!canLink(main.kind)) return;
  let html='<h3>「'+main.name+'」挂辅助</h3>'+
    '<p class="tip">挂上的辅助技会随这一招同步施放（六成强度，不占回合），并给主技加威力：辅助每级 +6%。<br>'+
    '一个辅助星位只能挂一个主技。</p>'+
    '<div style="display:flex;flex-direction:column;gap:5px;margin:10px 0">';
  let any=false;
  sk.forEach((s,j)=>{
    if(!s||!isAuxKind(s.kind)) return;
    any=true;
    const taker=auxTakenBy(j);
    const busy=taker!=null && taker!==mainIdx;
    const cur=G.links[mainIdx]===j;
    html+='<button '+(busy?'disabled':'')+' onclick="setLink('+mainIdx+','+j+')" style="text-align:left">'+
      (cur?'▣ ':'▢ ')+STARS[j]+' · '+s.name+' <b style="color:#8a5a1f">Lv'+s.lv+'</b>　'+
      (busy? '<span style="color:var(--cin)">已挂于'+STARS[taker]+'</span>' : '<span style="color:var(--ink2)">'+s.desc+'</span>')+
      '</button>';
  });
  if(!any) html+='<div class="sub2">这一套里没有辅助技（治疗／护盾／蓄势）。换换装备，或者把某件卸了重配。</div>';
  html+='</div><div class="row">'+
    (G.links[mainIdx]!=null? '<button onclick="setLink('+mainIdx+',null)">拆链</button>':'')+
    '<button onclick="closeModal()">关上</button></div>';
  document.getElementById('modal').innerHTML=html;
  document.getElementById('mask').classList.add('on');
}

/* ---------- 弹层 ---------- */
function closeModal(){ modalItem=null; document.getElementById('mask').classList.remove('on'); }
function showHelp(){
  document.getElementById('modal').innerHTML=
    '<h3>怎么玩</h3>'+
    '<p><b>1. 配</b>：三件装备分天、人、地。相邻两件「相生」×2，「相克」×¼。</p>'+
    '<p><b>2. 出招</b>：七星里的七个技能，全部由你的三才组合推导出来——三件各生一个本源技，两对关系各生一个合击技，整体结构生一个阵技，缺的两行生一个劫技。</p>'+
    '<p><b>3. 打</b>：点技能出招，敌人会一起还手。打空一波，下一波更多、更硬。</p>'+
    '<p><b>4. 掉宝</b>：打赢一波落两件（两成几率多一件）。掉率是陡的：<b>凡品 58%</b> → <b>灵品 26%</b> → <b>宝品 11%</b> → <b>仙品 4%</b> → <b>道品 1%</b>。波数越深、难度越高，好货越多。落宝浮层会一直挂着，点开就能看。<br>'+
    '　<b>每过五波，天地掉下三样东西，只能拿一样</b>：天赐宝光（一件宝品／仙品的蒙尘之器）、器魂、灵石、经脉点、地火余温（白提一档词条），或者古器名录（直接识得一件没见过的器）。</p>'+
    '<p><b>5. 鉴</b>：<b style="color:#a8811f">宝品以上捡到手是蒙尘的</b>，看不见名字、五行和词条，也吃不到属性。花 20 灵石「鉴」，才知道你捡到的到底是什么。</p>'+
    '<p><b>6. 品级</b>：词条数量随品级走（凡 0～2 条，道品 6 条）。词条分<b>前缀</b>（气血／攻击／法攻／防御，加数值，最多 3 条）与<b>后缀</b>（暴击／暴伤／增伤／减伤／噬血／反伤／破防／连击，按百分比，最多 3 条），合计 6 条上限。T1 最强、T5 最弱。</p>'+
    '<p><b>7. 熔炉</b>：<b>铸</b>（25 灵石，随机生一条，赌 T）／<b>淬</b>（20～80 灵石 + 2～8 器魂，你自己挑一条提一档，必定成）／<b>引</b>（70 灵石 + 10 器魂，定向指定词条，固定 T3）。<b style="color:#7a4a8a">器魂</b>靠拆解不要的装备来，越拆越会打。</p>'+
    '<p><b>8. 铭 / 灵 / 咒</b>：宝品起必带一条<b style="color:#a8811f">铭文</b>——很猛，但有代价，逼你取舍。仙品起多一条<b style="color:#7a4a8a">器灵</b>，它不讲数值，直接改规则。道品必带一条<b style="color:#a83b2c">凶咒</b>，摘不掉。</p>'+
    '<p><b>9. 底子</b>：五行决定词条倾向——金主锐（攻击／破防）、木主生（气血／噬血）、水主柔（法攻／减伤）、火主烈（攻击／暴伤）、土主厚（防御／反伤）。想要什么词条，先去找对应五行的底子。</p>'+
    '<p><b>10. 技阶</b>：稀有后缀「技阶」涨技能等级；本源技看自己那件装备，合击技取两边均值，阵技／劫技取三件均值。技能上限 <b>Lv7</b>，每级威力 +18%。</p>'+
    '<p><b>11. 链</b>：主动技可以挂一个辅助技（治疗／护盾／蓄势）。出招时辅助随招同步施放（六成强度，不占回合），并按等级给主技加威力（每级 +6%）。一个辅助只能挂一个主技。</p>'+
    '<p><b>12. 经脉</b>：破阵涨修为，满一级升境界、得 1 点经脉点。点顶部「经脉」开图，从「会阴」起手，任督上行入百会，两臂由膻中分出，下肢一路到涌泉。十二穴给的是永久属性；已通的穴还能再点一次「大成」，效果 ×1.8。</p>'+
    '<p><b>13. 拾遗录</b>：五行 × 六器 = 30 格图鉴。鉴出一件新器就记一笔，每集齐 5 器得 1 点经脉点。</p>'+
    '<p class="tip">三才决定「能打出多少倍」，词条决定「这一倍里有多少料」。<br>'+
    '前期先凑相生把倍率拉到 ×2 以上；中期开始攒器魂，用「引」把缺的那条补齐；后期就是为一件道品反复淬火。<br>'+
    '前缀 3 条 + 后缀 3 条是硬上限——想全都塞进去，得先捡到一件好底子。</p>'+
    '<div class="row"><button onclick="closeModal()">开始</button></div>';
  document.getElementById('mask').classList.add('on');
}

/* ---------- 重置 ---------- */
/* 手上是否凑得出乘算 ≥2 的三件 */
function hasGoodCombo(pool){
  for(let i=0;i<pool.length;i++)
    for(let j=i+1;j<pool.length;j++)
      for(let k=j+1;k<pool.length;k++)
        if(evaluate([pool[i],pool[j],pool[k]]).total>=2) return true;
  return false;
}

function resetAll(){
  G.wave=1; G.turn=1; G.best=0; G.stones=40;
  G.bag=[]; G.slots=[null,null,null]; G.log=[]; G.over=false;
  G.lv=1; G.xp=0; G.pts=0; G.mer={}; G.links={}; G.dex={}; G.soul=0;
  beams=[]; freeze=0;
  clearLoot();
  // 保证开局一定有能用的组合，不会一上来就卡死
  let tries=0;
  do{
    G.bag=[];
    for(let i=0;i<6;i++){
      // 开局给的是两件凡/灵品，且已鉴 —— 好货得自己去捡
      const it=makeItem(1, undefined, Math.random()<0.3?2:1);
      it.ident=true;
      G.bag.push(it);
    }
    tries++;
  } while(tries<25 && !hasGoodCombo(G.bag));
  document.getElementById('log').innerHTML='';
  startWave();
}

/* ---------- 自测辅助 ---------- */
function autoEquip(){
  G.slots.forEach((it,i)=>{ if(it){ G.bag.push(it); G.slots[i]=null; } });
  const pool=G.bag.slice();
  let best=null,bm=-1;
  for(let i=0;i<pool.length;i++)
    for(let j=0;j<pool.length;j++)
      for(let k=0;k<pool.length;k++){
        if(i===j||j===k||i===k) continue;
        const arr=[pool[i],pool[j],pool[k]];
        const t=evaluate(arr).total;
        if(t>bm){ bm=t; best=arr; }
      }
  if(!best){ for(let i=0;i<3 && G.bag.length;i++) G.slots[i]=G.bag.shift(); refresh(); return; }
  best.forEach(it=>{ const k=G.bag.indexOf(it); if(k>=0) G.bag.splice(k,1); });
  G.slots=best;
  refresh();
}

/* ---------- 启动 ---------- */
window.onerror=(m,s,l)=>{ document.title='ERR: '+m+' @'+l; };
resetAll();
requestAnimationFrame(loop);
if(!location.search.includes('nohelp')) showHelp();
if(location.search.includes('auto')){
  G.autoPick=true;
  autoEquip();
  setInterval(()=>{
    if(G.busy||G.over||!alive().length) return;
    // 有钱先鉴 —— 蒙尘的东西佩上了也是白佩
    const un=G.bag.find(i=>i.ident===false);
    if(un && G.stones>=IDENT_COST){ identify(un.id); return; }
    const sk=buildSkills();
    let pick=-1;
    for(let i=0;i<sk.length;i++){
      if(sk[i] && sk[i].kind!=='heal' && sk[i].kind!=='shield'){ pick=i; break; }
    }
    if(pick<0) for(let i=0;i<sk.length;i++){ if(sk[i]){ pick=i; break; } }
    if(pick>=0) castSkill(pick);
  }, 760);
}
