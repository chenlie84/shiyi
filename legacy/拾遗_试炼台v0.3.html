<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拾遗 · 试炼台 v0.3</title>
<style>
  :root{
    --paper:#f4efe2;--paper2:#e8dfc9;--ink:#241f18;--ink2:#6b6154;
    --line:#c9bda2;--jade:#2f6b52;--cin:#a83b2c;--gold:#a8811f;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",monospace;
    font-size:13px;line-height:1.6;user-select:none;
    background-image:linear-gradient(rgba(201,189,162,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(201,189,162,.22) 1px,transparent 1px);
    background-size:16px 16px;
  }
  .app{max-width:1180px;margin:0 auto;padding:12px}
  .top{display:flex;align-items:center;gap:14px;border:2px solid var(--ink);background:var(--paper2);padding:7px 12px;margin-bottom:10px;flex-wrap:wrap}
  .logo{font-size:15px;font-weight:800;letter-spacing:4px}
  .stat{font-size:12px;color:var(--ink2)}
  .stat b{color:var(--ink)}
  .spacer{flex:1}
  button{font-family:inherit;font-size:12px;padding:5px 12px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer;letter-spacing:1px}
  button:hover{background:var(--ink);color:var(--paper)}
  button:disabled{opacity:.3;cursor:not-allowed}
  button.sm{padding:1px 6px;font-size:10px;border-width:1px;letter-spacing:0}
  .main{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
  .left{flex:0 0 auto}
  canvas{display:block;border:3px solid var(--ink);image-rendering:pixelated;background:#15120e}
  .right{flex:1;min-width:380px;display:flex;flex-direction:column;gap:8px}
  .panel{border:2px solid var(--ink);background:var(--paper2);padding:9px 11px}
  .ph{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:2px;color:var(--ink2);margin-bottom:7px}
  .ph:after{content:"";flex:1;height:1px;background:var(--line)}
  /* 三才 */
  .slots{display:flex;align-items:center;gap:3px;justify-content:center}
  .slot{width:78px;height:92px;border:2px dashed var(--line);background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:.1s}
  .slot.filled{border-style:solid;border-color:var(--ink)}
  .slot:hover{background:#fffdf7}
  .slot .pos{position:absolute;top:1px;left:0;right:0;text-align:center;font-size:9px;color:var(--ink2);letter-spacing:1px}
  .slot .el{font-size:23px;font-weight:700;line-height:1;font-family:"STKaiti","KaiTi",serif}
  .slot .fx{font-size:8px;color:var(--ink2);line-height:1.3}
  .conn{width:36px;text-align:center;font-size:10px;line-height:1.2}
  .conn .r{font-size:12px;font-weight:700}
  .mulbox{display:flex;align-items:baseline;gap:9px;margin:6px 0 3px;flex-wrap:wrap}
  .big{font-size:26px;font-weight:800;letter-spacing:-1px;line-height:1}
  .tag{font-size:10.5px;padding:1px 6px;border:1px solid currentColor;letter-spacing:1px}
  /* 属性 */
  .attrs{display:grid;grid-template-columns:repeat(4,1fr);gap:2px 8px;font-size:11.5px;margin-top:5px}
  .attrs div{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);padding:1px 0}
  .attrs span{color:var(--ink2)}
  /* 七星技能 */
  .skills{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .sk{border:2px solid var(--line);background:var(--paper);padding:5px 7px;cursor:pointer;position:relative;transition:.1s}
  .sk:hover:not(.dis){border-color:var(--gold);background:#fffdf7}
  .sk.dis{opacity:.32;cursor:not-allowed}
  .sk .nm{font-size:12px;font-weight:700;display:flex;justify-content:space-between;gap:4px}
  .sk .star{font-size:8.5px;color:var(--gold);letter-spacing:.5px}
  .sk .ds{font-size:9.5px;color:var(--ink2);line-height:1.35;margin-top:1px}
  .sk .pw{font-size:9.5px;color:var(--cin);font-weight:700}
  .sk .lv{font-size:9px;color:#8a5a1f;font-weight:800;letter-spacing:0}
  .sk .lk{font-size:9px;margin-top:3px;padding:1px 4px;border:1px dashed var(--line);color:var(--ink);background:#fffdf7;letter-spacing:0;font-weight:600}
  .sk .lk:hover{border-color:#8a5a1f;background:#fffaf0;color:var(--ink)}
  .sk .lk.dim{border-style:dotted;opacity:.62;cursor:default;font-weight:400;background:none}
  .sk .lk.dim:hover{background:none;border-color:var(--line);color:var(--ink2)}
  /* 经脉 */
  .merwrap{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
  .merbody{flex:0 0 320px;background:#faf6ea;border:1px solid var(--line)}
  .merinfo{flex:1;min-width:200px}
  .merinfo .mrow{font-size:11.5px;border-bottom:1px dotted var(--line);padding:3px 0;display:flex;justify-content:space-between;gap:8px}
  .merinfo .mrow b{font-weight:700}
  .merinfo h4{margin:10px 0 4px;font-size:11px;letter-spacing:2px;color:var(--ink2);font-weight:400}
  .node{cursor:default}
  .node.on{cursor:pointer}
  .node.on:hover circle{stroke-width:3}
  .merbar{display:flex;align-items:center;gap:8px;margin:6px 0 10px;font-size:11.5px}
  .xpbar{flex:1;height:7px;background:var(--paper2);border:1px solid var(--line);max-width:200px}
  .xpbar i{display:block;height:100%;background:#8a5a1f}
  .sk.cool{opacity:.5}
  .sk.cool:after{content:"冷却";position:absolute;right:4px;bottom:2px;font-size:8px;color:var(--cin)}
  /* 行囊 */
  .bag{display:flex;gap:5px;flex-wrap:wrap;min-height:64px;margin-top:6px}
  .item{width:96px;border:2px solid var(--line);background:var(--paper);padding:4px 3px;text-align:center;cursor:pointer;position:relative}
  .item:hover{border-color:var(--gold)}
  .item .el{font-size:16px;font-weight:700;line-height:1.1;font-family:"STKaiti","KaiTi",serif}
  .item .nm{font-size:9.5px;color:var(--ink);font-weight:700;letter-spacing:.5px}
  .item .n{font-size:8px;color:var(--ink2)}
  .item .af{font-size:8px;line-height:1.35;margin-top:2px}
  .item.broken{border-style:dashed}
  .item .act{display:flex;gap:2px;justify-content:center;margin-top:2px}
  /* 弹层 */
  .mask{position:fixed;inset:0;background:rgba(36,31,24,.62);display:none;align-items:center;justify-content:center;z-index:50}
  .mask.on{display:flex}
  .modal{background:var(--paper);border:3px solid var(--ink);padding:16px 20px;max-width:600px;width:92%;max-height:86vh;overflow-y:auto}
  .modal h3{margin:0 0 8px;font-size:15px;letter-spacing:2px}
  .modal p{margin:5px 0;font-size:12.5px;color:var(--ink2)}
  .modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
  .tip{font-size:11px;color:var(--ink2);margin-top:6px;line-height:1.65}
  .sub2{font-size:10.5px;color:var(--ink2)}
  .log{height:74px;overflow-y:auto;font-size:11px;line-height:1.6;color:var(--ink2);border:1px solid var(--line);background:var(--paper);padding:5px 7px}
  .log div{border-bottom:1px dotted var(--line);padding:1px 0}
  @media(max-width:960px){.right{min-width:100%}}
</style>
</head>
<body>
<div class="app">

  <div class="top">
    <div class="logo">拾 遗 · 试 炼</div>
    <div class="stat">第 <b id="wave">1</b> 波</div>
    <div class="stat">回合 <b id="turn">1</b></div>
    <div class="stat">最高 <b id="best">0</b></div>
    <div class="stat">灵石 <b id="stones">0</b></div>
    <div class="stat">境界 <b id="lv">1</b> <span id="xptxt" style="font-size:10px">0/26</span></div>
    <button onclick="showMeridian()" style="border-color:#8a5a1f">经脉 <b id="pts" style="color:#8a5a1f">0</b></button>
    <div class="spacer"></div>
    <div class="stat">难度
      <select id="diff" onchange="setDiff()" style="font-family:inherit;font-size:12px;border:1px solid var(--line);background:var(--paper);padding:2px 4px">
        <option value="0.7">练气 · 易</option>
        <option value="1" selected>筑基 · 常</option>
        <option value="1.5">金丹 · 难</option>
        <option value="2.2">元婴 · 苦</option>
        <option value="3.2">化神 · 死</option>
      </select>
    </div>
    <button onclick="showHelp()">玩法</button>
    <button onclick="resetAll()">重来</button>
  </div>

  <div class="main">
    <div class="left">
      <canvas id="cv" width="640" height="520"></canvas>
      <div class="tip" style="width:640px">点下面七星技能出招。敌人会一起还手。</div>
    </div>

    <div class="right">
      <div class="panel">
        <div class="ph">三才 · 天 / 人 / 地 <span class="sub2" style="letter-spacing:0">点装备看词条</span></div>
        <div class="slots" id="slots"></div>
        <div class="mulbox">
          <div class="big" id="mul">×1.00</div>
          <div class="tag" id="school" style="color:var(--ink2)">未成阵</div>
          <div class="sub2" id="rels">—</div>
        </div>
        <div class="attrs" id="attrs"></div>
      </div>

      <div class="panel">
        <div class="ph">北斗七星 · 七技</div>
        <div class="skills" id="skills"></div>
      </div>

      <div class="panel">
        <div class="ph">战报</div>
        <div class="log" id="log"></div>
      </div>
    </div>
  </div>

  <div class="panel" style="margin-top:10px">
    <div class="ph">行囊 <span class="sub2" id="bagcnt"></span>
      <span class="sub2" style="letter-spacing:0">点卡片看详情 · 「炼」25 灵石加词条（前 3 + 后 3）· 「卖」换灵石</span>
    </div>
    <div class="bag" id="bag"></div>
  </div>
</div>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>

<script>
/* ==========================================================
   拾遗 · 试炼台 v0.3
   三才配装 → 七技生成 → 多怪回合制
   ========================================================== */

const XING=['木','火','土','金','水'];
const SHENG={木:'火',火:'土',土:'金',金:'水',水:'木'};
const KE={木:'土',土:'水',水:'火',火:'金',金:'木'};
const COL={木:'#4d8a5e',火:'#b8432f',土:'#a8811f',金:'#5b7c96',水:'#6b4a7a'};
const MULT={生:2,逆生:1,比和:1,克:0.25};
const SHA_LOSS=0.75;

/* ---------- 词条：仿 PoE 的前缀 / 后缀 / T 级 ---------- */
/* 前缀：纯数值，最多 3 条。数组由 T5 排到 T1 */
const PRE={
  hp :{n:'气血',c:'#a83b2c',v:[15,30,50,75,110]},
  atk:{n:'攻击',c:'#b8432f',v:[4,7,11,16,22]},
  mag:{n:'法攻',c:'#6b4a7a',v:[3,5,8,12,17]},
  def:{n:'防御',c:'#5b7c96',v:[2,4,6,9,13]},
};
/* 后缀：百分比/机制，最多 3 条 */
const SUF={
  crit   :{n:'暴击',c:'#c9862f',v:[3,5,8,11,15],  u:'%'},
  critDmg:{n:'暴伤',c:'#c9862f',v:[10,18,26,36,48],u:'%'},
  inc    :{n:'增伤',c:'#a83b2c',v:[6,10,15,20,26],u:'%'},
  red    :{n:'减伤',c:'#2f6b52',v:[4,7,10,14,18], u:'%'},
  leech  :{n:'噬血',c:'#2f6b52',v:[3,5,7,10,14],  u:'%'},
  reflect:{n:'反伤',c:'#6b4a7a',v:[5,9,14,19,25], u:'%'},
  pen    :{n:'破防',c:'#5b7c96',v:[6,10,15,20,26],u:'%'},
  dbl    :{n:'连击',c:'#38617f',v:[5,8,12,16,20], u:'%'},
};
/* 稀有后缀：只有它涨技能等级，常规池里抽不到，单独走 16% 稀有通道 */
const RARE={ sk:{n:'技阶',c:'#8a5a1f',v:[1,1,1,1,2],u:''} };
Object.assign(SUF, RARE);
const PREK=Object.keys(PRE), SUFK=Object.keys(SUF).filter(k=>k!=='sk');
const TIERC=['#8d8474','#6b6154','#7a6a3a','#a8811f','#a83b2c'];  // T5 → T1

/* 五行底子倾向：同一种五行，更容易长出贴合它的词条。
   金主锐 → 攻击/破防；木主生 → 气血/噬血；水主柔 → 法攻/减伤；
   火主烈 → 攻击/暴伤；土主厚 → 防御/反伤。 */
const ELEM_PREF={
  金:{pre:['atk','atk','def'],   suf:['pen','pen','crit','critDmg','inc']},
  木:{pre:['hp','hp','atk'],     suf:['leech','leech','red','dbl','inc']},
  水:{pre:['mag','mag','hp'],    suf:['red','red','leech','leech','dbl']},
  火:{pre:['atk','atk','mag'],   suf:['critDmg','critDmg','inc','crit','dbl']},
  土:{pre:['def','def','hp'],    suf:['reflect','reflect','red','leech','inc']},
};

const GNAME=['','凡品','灵品','宝品','仙品','道品'];

/* 装备名：全部取自公有领域古籍，按品级递进 */
const ITEM_NAMES={
  金:['鱼肠剑','巨阙剑','纯钧剑','湛卢剑','泰阿剑','昆吾剑'],   // 《越绝书》《吴越春秋》《列子》
  木:['桃木杖','九节杖','打神鞭','缚龙索','降魔杵','青帝幡'],   // 《封神演义》、道藏
  水:['甘露瓶','琉璃盏','定海珠','寒玉尺','玄冥圭','坎水珠'],   // 《西游记》《封神演义》
  火:['赤霄剑','离火轮','落魂钟','火云罩','朱雀羽','混元金斗'], // 《西京杂记》《封神演义》
  土:['息壤圭','厚土圭','镇岳印','番天印','戊己幡','九鼎']      // 《山海经》《史记》《封神演义》
};

/* ---------- 经脉：人形十二穴 ---------- */
/* 会阴为总根，任督上行入百会，两臂由膻中分出，下肢由会阴下行 */
const MER=[
  {id:'huiyin',  n:'会阴',  x:160, y:246, req:null,        t:'hp',      v:30, d:'气血 +30'},
  {id:'qihai',   n:'气海',  x:160, y:208, req:'huiyin',    t:'hpPct',   v:12, d:'气血 +12%'},
  {id:'zhongwan',n:'中脘',  x:160, y:170, req:'qihai',     t:'def',     v:4,  d:'防御 +4'},
  {id:'danzhong',n:'膻中',  x:160, y:132, req:'zhongwan',  t:'red',     v:6,  d:'减伤 +6%'},
  {id:'chengjiang',n:'承浆',x:160, y:94,  req:'danzhong',  t:'healB',   v:15, d:'疗愈 +15%'},
  {id:'baihui',  n:'百会',  x:160, y:46,  req:'chengjiang',t:'sk',      v:1,  d:'全技阶 +1'},
  {id:'jianjing',n:'肩井',  x:126, y:106, req:'danzhong',  t:'atk',     v:4,  d:'攻击 +4'},
  {id:'quchi',   n:'曲池',  x:108, y:166, req:'jianjing',  t:'crit',    v:6,  d:'暴击 +6%'},
  {id:'rjianjing',n:'右肩井',x:194, y:106,req:'danzhong',  t:'mag',     v:4,  d:'法攻 +4'},
  {id:'rquchi',  n:'右曲池',x:212, y:166, req:'rjianjing', t:'critDmg', v:20, d:'暴伤 +20%'},
  {id:'zusanli', n:'足三里',x:160, y:332, req:'huiyin',    t:'reflect', v:10, d:'反伤 +10%'},
  {id:'yongquan',n:'涌泉',  x:160, y:406, req:'zusanli',   t:'dbl',     v:8,  d:'连击 +8%'},
];

/* ---------- 状态 ---------- */
const G={
  wave:1, turn:1, best:0, stones:0, diff:1,
  bag:[], slots:[null,null,null],
  lv:1, xp:0, pts:0, mer:{}, links:{},
  uid:1, busy:false, over:false, log:[]
};
function xpNeed(lv){ return 26+(lv-1)*12; }
function merBonus(){
  const b={};
  MER.forEach(nd=>{
    const lv=G.mer[nd.id]||0;
    if(!lv) return;
    b[nd.t]=(b[nd.t]||0)+nd.v*(lv>=2?1.8:1);   // 二阶「大成」效果 ×1.8
  });
  return b;
}

/* ---------- 生成装备：固定 2 条基础词条 ---------- */
function effGrade(it){ return it.broken? Math.max(1,it.grade-1): it.grade; }

/* T 级：1 最强。品级越高越容易出高 T —— 凡品最高 T5，道品可出 T1 */
function rollTier(grade){
  const best=Math.max(1, 6-grade);
  const t = best - (Math.random()<0.45?1:0);
  return Math.max(1,Math.min(5,t));
}
function rollAffix(grade, kind, elem){
  if(!kind) kind = Math.random()<0.45?'pre':'suf';
  const t=rollTier(grade);
  // 稀有通道：12% 直接出「技阶」，不看五行倾向
  if(kind==='suf' && Math.random()<0.16){
    return {kind:'suf', k:'sk', t, v:RARE.sk.v[5-t]};
  }
  const P=ELEM_PREF[elem];
  let key;
  if(P && Math.random()<0.8){          // 八成顺着五行长，两成完全随机
    const pool = kind==='pre'? P.pre : P.suf;
    key = pool[Math.floor(Math.random()*pool.length)];
  } else {
    const pool = kind==='pre'? PREK : SUFK;
    key = pool[Math.floor(Math.random()*pool.length)];
  }
  const def = kind==='pre'? PRE[key] : SUF[key];
  return {kind, k:key, t, v:def.v[5-t]};
}
function cntPre(it){ return it.affixes.filter(a=>a.kind==='pre').length; }
function cntSuf(it){ return it.affixes.filter(a=>a.kind==='suf').length; }
function afDef(a){ return a.kind==='pre'?PRE[a.k]:SUF[a.k]; }
function afUnit(a){ const d=afDef(a); return a.kind==='pre' ? '' : (d.u||''); }
function afLabel(a){
  const d=afDef(a), u=afUnit(a);
  return '<span style="color:'+d.c+'">'+d.n+' +'+a.v+u+'</span>'+
         '<span style="color:'+TIERC[a.t-1]+';font-weight:700"> T'+a.t+'</span>';
}
function afText(it){
  return it.affixes.map(a=>{ const d=afDef(a); return d.n+'+'+a.v+afUnit(a)+' T'+a.t; }).join(' / ');
}
function reTier(a,t){
  a.t=Math.max(1,Math.min(5,t));
  const def=afDef(a);
  a.v=def.v[5-a.t];
}
/* 该装备还能不能长词条：前缀满 3 条、后缀满 3 条，合计上限 6 */
function freeKind(it){
  const p=cntPre(it)<3, s=cntSuf(it)<3;
  if(p&&s) return Math.random()<0.5?'pre':'suf';
  return p?'pre': s?'suf': null;
}

function makeItem(wave, forceBroken){
  const x=XING[Math.floor(Math.random()*5)];
  const y=Math.random()<0.5?'阳':'阴';
  let grade=1+Math.floor(Math.random()*2)+Math.floor(wave/4);
  grade=Math.max(1,Math.min(5,grade));
  const broken = forceBroken!==undefined? forceBroken : Math.random()<0.45;
  const it={id:G.uid++,x,y,grade,broken,affixes:[],name:''};
  it.affixes.push(rollAffix(grade,'pre',x));
  it.affixes.push(rollAffix(grade,'suf',x));
  const pool=ITEM_NAMES[x];
  let idx=Math.min(pool.length-1, (grade-1) + (Math.random()<0.5?0:1));
  it.base=pool[idx];
  it.name=it.base+(broken?'·残':'')+'·'+y+x;
  return it;
}

/* ---------- 三才 ---------- */
function relOf(a,b){
  if(a.x===b.x) return '比和';
  if(SHENG[a.x]===b.x) return '生';
  if(SHENG[b.x]===a.x) return '逆生';
  return '克';
}
function evaluate(arr){
  const a=arr[0],b=arr[1],c=arr[2];
  if(!a||!b||!c){
    const rs=[];
    if(a&&b) rs.push(relOf(a,b));
    if(b&&c) rs.push(relOf(b,c));
    let m=1; rs.forEach(r=>m*=MULT[r]);
    return {r1:rs[0]||'—',r2:rs[1]||'—',m,total:m,sha:0,burn:false,partial:true};
  }
  const r1=relOf(a,b), r2=relOf(b,c);
  let m=MULT[r1]*MULT[r2];
  let sha=0;
  if(r1==='克') sha+=SHA_LOSS;
  if(r2==='克') sha+=SHA_LOSS;
  const burn= sha>0 && r2==='生';
  const raw=m+(burn?sha:0);
  const yyAll=a.y==='阳'&&b.y==='阳'&&c.y==='阳';
  const yyNone=a.y==='阴'&&b.y==='阴'&&c.y==='阴';
  const yyMul=(yyAll||yyNone)?0.5:1;
  return {r1,r2,m,sha,burn,raw,yyAll,yyNone,yyMul,total:raw*yyMul};
}

/* ---------- 属性（词条 + 经脉） ---------- */
function calcStats(){
  const e=evaluate(G.slots);
  const s={hp:66,atk:13,mag:8,def:0};
  const q={inc:0,red:0,leech:0,reflect:0,pen:0,crit:5,critDmg:50,dbl:0,sk:0,skMer:0,healB:0};
  // 经脉先落地
  const mb=merBonus();
  s.hp+=mb.hp||0; s.atk+=mb.atk||0; s.mag+=mb.mag||0; s.def+=mb.def||0;
  s.hp*=1+(mb.hpPct||0)/100;
  q.red+=mb.red||0; q.crit+=mb.crit||0; q.critDmg+=mb.critDmg||0;
  q.pen+=mb.pen||0; q.reflect+=mb.reflect||0; q.dbl+=mb.dbl||0;
  q.healB+=mb.healB||0; q.skMer+=mb.sk||0;   // 经脉的技阶单独记，别和装备混

  G.slots.forEach(it=>{
    if(!it) return;
    const eg=effGrade(it);
    s.hp+=eg*6; s.atk+=eg*1.6; s.def+=eg*0.8;
    let skl=0;
    it.affixes.forEach(a=>{
      if(a.kind==='pre') s[a.k]=(s[a.k]||0)+a.v;
      else if(a.k==='sk'){ skl+=a.v; q.sk+=a.v; }   // 技阶只涨技能等级，不进战斗数值

      else q[a.k]=(q[a.k]||0)+a.v;
    });
    it.skLv=skl;                                    // 本器技阶
  });
  // 增伤按乘算作用于攻/法攻
  s.atk=Math.round(s.atk*(1+q.inc/100));
  s.mag=Math.round(s.mag*(1+q.inc/100));
  s.hp=Math.round(s.hp);
  q.red=Math.min(60,q.red);                         // 减伤上限 60%
  return {s,q,e};
}

const ELEM_SKILL={

const REL_SKILL={
  '生'  :{n:'生生诀',kind:'buff',pow:1.0,d:'下一击伤害翻倍'},   // 「生生之谓易」，《周易》
  '逆生':{n:'逆流引',kind:'buff',pow:0.9,d:'反弹本回合伤害'},

};

const SK_MAX=7;
function clampLv(n){ return Math.max(1, Math.min(SK_MAX, n)); }

function buildSkills(){
  const [a,b,c]=G.slots;
  const st=calcStats();
  const gb=st.q.skMer||0;                                // 只取经脉（百会）给的全局技阶
  const skOf=it=> (it? (it.skLv||0) : 0);
  const total=skOf(a)+skOf(b)+skOf(c);
  const sk=[];
  const names=['天枢','天璇','天玑','天权','玉衡','开阳','摇光'];

  // 1-3 本源技：等级看自己那件装备的技阶
  [a,b,c].forEach(it=>{
    if(!it){ sk.push(null); return; }
    const t=ELEM_SKILL[it.x+it.y];
    const dup = sk.some(x=>x&&x.name===t.n);
    sk.push({pos:names[sk.length],name:(dup? t.n+'·贰' : t.n),kind:t.kind,pow:t.pow,desc:t.d,
      elem:it.x,grade:effGrade(it),from:'本源',item:it,
      lv:clampLv(1+skOf(it)+gb)});
  });
  // 4-5 合击技：等级取两边平均
  const pairs=[[a,b],[b,c]];
  pairs.forEach((p,i)=>{
    if(!p[0]||!p[1]){ sk.push(null); return; }
    const r=relOf(p[0],p[1]);
    const t=REL_SKILL[r];
    const boost = r==='生'?1.25:1;
    sk.push({pos:names[3+i],name:t.n,kind:t.kind,pow:t.pow*boost,desc:t.d,
      elem:p[0].x,grade:Math.min(effGrade(p[0]),effGrade(p[1])),rel:r,from:'合击',
      lv:clampLv(1+Math.floor((skOf(p[0])+skOf(p[1]))/2)+gb)});
  });
  // 6 阵技 / 7 劫技：等级取三件均值
  const avg=clampLv(1+Math.floor(total/3)+gb);
  if(a&&b&&c){
    const e=evaluate(G.slots);
    if(e.r1==='生'&&e.r2==='生')
      sk.push({pos:names[5],name:'周天璇玑',kind:'aoe',pow:1.5,desc:'璇玑玉衡，《尚书·舜典》；全体大伤',elem:a.x,grade:5,from:'阵',lv:avg});
    else if(e.r1==='克'&&e.r2==='克')
      sk.push({pos:names[5],name:'煞气冲斗',kind:'aoe',pow:1.3,desc:'剑气冲斗牛，《晋书》；全体伤害，自损一成',elem:b.x,grade:4,from:'阵',selfHurt:0.1,lv:avg});
    else if(a.x===b.x&&b.x===c.x)
      sk.push({pos:names[5],name:'抱元守一',kind:'atk',pow:2.2,desc:'《道德经》抱元守一；单体巨伤',elem:a.x,grade:5,from:'阵',lv:avg});
    else
      sk.push({pos:names[5],name:'乱阵',kind:'atk',pow:1.0,desc:'三才不成章法，只此一击',elem:a.x,grade:2,from:'阵',lv:avg});
    // 劫技：缺的行越多越弱
    const used=new Set([a.x,b.x,c.x]);
    const miss=XING.filter(x=>!used.has(x));
    const p = miss.length===2?2.0: miss.length===3?1.4:1.0;
    sk.push({pos:names[6],name:miss.length?miss.join('')+'之厄':'圆满之厄',kind:'atk',
      pow:p,desc:'劫位之力，缺 '+miss.length+' 行',elem:miss[0]||a.x,grade:5,from:'劫',miss:miss.length,
      lv:clampLv(1+Math.floor(total/3)+gb+ (miss.length===0?1:0))});
  } else {
    sk.push(null); sk.push(null);
  }
  return sk;
}

/* ---------- 技能链接：辅助技挂在主动技上 ---------- */
const isAuxKind = k => k==='heal'||k==='shield'||k==='buff';
const canLink   = k => k==='atk'||k==='aoe';
/* 返回被链接的辅助技（星位会随配装变，取用前都校验类型） */
function auxOf(idx, list){
  const ln=G.links[idx];
  if(ln==null || ln===idx) return null;
  const s=(list||buildSkills())[ln];
  if(!s || !isAuxKind(s.kind)) return null;
  return s;
}
/* 已被别的主动技占用的辅助星位 */
function auxTakenBy(auxIdx){
  for(const k in G.links){ if(G.links[k]===auxIdx) return +k; }
  return null;
}

/* 技能威力：等级每级 +18% */
function skillPower(s, stats, e){
  if(!s) return 0;
  const base = isAuxKind(s.kind) ? stats.mag : stats.atk;
  const lvm = 1 + ((s.lv||1)-1)*0.18;
  return Math.round(base * s.pow * e.total * (1 + (s.grade||1)*0.12) * lvm);
}

function makeWave(n){
  const d=G.diff;
  const cnt=Math.min(4, 2+Math.floor(n/4));
  const arr=[];
  for(let i=0;i<cnt;i++){
    const hp=Math.round((50+n*18)*d*(0.85+Math.random()*0.35));

    });
  }
  return arr;
}

function updateVisual(dt){
  if(shake>0) shake=Math.max(0,shake-dt*2.6);
  if(hitFlash>0) hitFlash=Math.max(0,hitFlash-dt*3);
  if(pHurt>0) pHurt=Math.max(0,pHurt-dt);
  if(pAnim>0) pAnim=Math.max(0,pAnim-dt);
  mobs.forEach(m=>{
    if(m.hurt>0) m.hurt=Math.max(0,m.hurt-dt);
    if(m.hx) m.hx*=Math.pow(0.0009,dt);
    if(m.atkAnim>0) m.atkAnim=Math.max(0,m.atkAnim-dt);
  });
  parts.forEach(p=>{ p.t+=dt; p.vy+=560*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; });
  parts=parts.filter(p=>p.t<p.life);
  floats.forEach(f=>{ f.t+=dt; f.y-=38*dt; });
  floats=floats.filter(f=>f.t<f.life);
}

function render(){
  const sx=(Math.random()-0.5)*shake*18, sy=(Math.random()-0.5)*shake*18;
  ctx.save(); ctx.translate(sx,sy);
  drawBG(); drawMobs(); drawHero(); drawBottom();
  parts.forEach(p=>{ ctx.globalAlpha=Math.max(0,1-p.t/p.life); ctx.fillStyle=p.c; ctx.fillRect(p.x,p.y,p.s,p.s); });
  ctx.globalAlpha=1;
  floats.forEach(f=>{
    ctx.globalAlpha=Math.max(0,1-Math.pow(f.t/f.life,2));
    ctx.font=(f.big?'bold 22px':'bold 15px')+' monospace';
    ctx.fillStyle=f.c; ctx.textAlign='center'; ctx.fillText(f.txt,f.x,f.y);
  });
  ctx.globalAlpha=1; ctx.textAlign='left';
  if(hitFlash>0){ ctx.fillStyle='rgba(200,40,30,'+(hitFlash*0.25)+')'; ctx.fillRect(0,0,cv.width,cv.height); }
  ctx.restore();
}
let last=0;
function loop(t){
  const dt=Math.min(0.05,(t-last)/1000||0); last=t;
  updateVisual(dt); render(); requestAnimationFrame(loop);
}

/* ---------- 音效 ---------- */
let AC=null;
function sfx(type){
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
    o.connect(g); g.connect(AC.destination);
    if(type==='hit'){o.type='square';o.frequency.setValueAtTime(190,t);o.frequency.exponentialRampToValueAtTime(70,t+.09);g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+.11);o.start(t);o.stop(t+.12);}
    else if(type==='crit'){o.type='sawtooth';o.frequency.setValueAtTime(430,t);o.frequency.exponentialRampToValueAtTime(110,t+.15);g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+.17);o.start(t);o.stop(t+.18);}
    else if(type==='hurt'){o.type='triangle';o.frequency.setValueAtTime(95,t);o.frequency.exponentialRampToValueAtTime(48,t+.15);g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.start(t);o.stop(t+.19);}
    else if(type==='win'){o.type='square';o.frequency.setValueAtTime(320,t);o.frequency.setValueAtTime(480,t+.07);o.frequency.setValueAtTime(640,t+.14);g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.32);}
    else if(type==='heal'){o.type='sine';o.frequency.setValueAtTime(520,t);o.frequency.linearRampToValueAtTime(760,t+.18);g.gain.setValueAtTime(.04,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.start(t);o.stop(t+.24);}
  }catch(e){}
}

  G.log.unshift('<div>'+(cls?'<span style="color:'+cls+'">':'')+txt+(cls?'</span>':'')+'</div>');
  if(G.log.length>40) G.log.pop();
  document.getElementById('log').innerHTML=G.log.join('');
}

/* ---------- 战斗 ---------- */
let php=1;

function startWave(){
  mobs=makeWave(G.wave);
  G.turn=1; G.busy=false; G.over=false;
  const st=calcStats();
  php=st.s.hp; shield=0; buffNext=0; reflect=0;
  log('第 '+G.wave+' 波 · 来了 '+mobs.length+' 只。','#a83b2c');
  refresh();
}

function alive(){ return mobs.filter(m=>!m.dead); }

function castSkill(idx){
  if(G.busy||G.over) return;
  const list=buildSkills();
  const sk=list[idx];
  if(!sk) return;
  const st=calcStats();
  const e=st.e;
  const q=st.q;
  const aux = canLink(sk.kind) ? auxOf(idx, list) : null;
  G.busy=true;
  pAnim=0.3;

  const p=skillPower(sk,st.s,e);
  const targets = sk.kind==='aoe' ? alive() : [alive()[0]].filter(Boolean);
  if(!targets.length){ G.busy=false; return; }

  const healB=1+(q.healB||0)/100;
  const linkMul = aux ? 1 + (aux.lv||1)*0.06 : 1;        // 辅助技等级 → 主攻威力
  const linkBuff = (aux && aux.kind==='buff') ? 1.3 : 1;  // 蓄势类链接：本击 +30%

  // 链接的辅助技随这一招同步触发，按六成强度
  if(aux){
    if(aux.kind==='heal'){
      const h=Math.round(skillPower(aux,st.s,e)*0.9*0.6*healB);
      php=Math.min(st.s.hp, php+h);
      floatText(PLAYER_X, GROUND-120, '链 +'+h, '#6cbb8c');
      log('　链·'+aux.name+'：回气血 '+h, '#2f6b52');
    } else if(aux.kind==='shield'){
      const v=Math.round(skillPower(aux,st.s,e)*0.8*0.6*healB);
      shield+=v;
      floatText(PLAYER_X, GROUND-120, '链 盾 '+v, '#6fa8c9');
      log('　链·'+aux.name+'：护盾 '+v, '#38617f');
    } else {
      floatText(PLAYER_X, GROUND-120, '链 蓄势', '#c9a227');
      log('　链·'+aux.name+'：本击助势 ×1.3', '#a8811f');
    }
  }

  if(sk.kind==='heal'){
    const heal=Math.round(p*0.9*healB);
    php=Math.min(st.s.hp, php+heal);
    floatText(PLAYER_X, GROUND-96, '+'+heal, '#6cbb8c', true);
    burst(PLAYER_X, GROUND-40, 12, '#6cbb8c');
    sfx('heal');
    log(sk.name+' Lv'+sk.lv+'：回气血 '+heal);
  } else if(sk.kind==='shield'){
    const sv=Math.round(p*0.8*healB);
    shield+=sv;
    floatText(PLAYER_X, GROUND-96, '护盾 '+sv, '#6fa8c9', true);
    sfx('heal');
    log(sk.name+' Lv'+sk.lv+'：护盾 '+sv);
  } else if(sk.kind==='buff'){
    buffNext=2;
    floatText(PLAYER_X, GROUND-96, '蓄势', '#c9a227', true);
    sfx('heal');
    log(sk.name+' Lv'+sk.lv+'：下一击威力翻倍');
  } else {
    const doubled = buffNext>0;
    if(doubled) buffNext=0;
    let top=0;

    const strike=(m, scale, extra)=>{
      let dmg = p*(0.85+Math.random()*0.3);
      if(sk.kind!=='aoe') dmg*=1.15;
      if(doubled) dmg*=2;
      dmg*=scale*linkMul*linkBuff;
      // 破防：按比例削减目标气防，等效增伤
      dmg*= (1 + (q.pen/100)*0.6);
      const crit = Math.random()*100 < q.crit;
      if(crit) dmg*= (1+q.critDmg/100);
      const v=Math.max(1, Math.round(dmg));
      m.hp-=v; m.hurt=0.16; m.hx=12;
      burst(m.x, m.y-10, crit?16:10, crit?'#ffd166':'#e8b04a');
      floatText(m.x+(Math.random()-0.5)*24, m.y-24-(extra?15:0),
        (extra||'')+(crit?'暴 ':'')+v, crit?'#ffd166':(doubled?'#ffe9a8':'#f0e6c0'), crit||doubled);
      if(crit){ sfx('crit'); shake=Math.max(shake,0.7); }
      top=Math.max(top,v);
      // 噬血
      if(q.leech>0){
        const h=Math.round(v*q.leech/100);
        if(h>0){ php=Math.min(st.s.hp, php+h); floatText(PLAYER_X+(Math.random()-0.5)*18, GROUND-104, '+'+h, '#6cbb8c'); }
      }
      if(m.hp<=0){ m.dead=true; m.hp=0; }
    };

    targets.forEach(m=>{
      strike(m,1,'');
      // 连击：额外一记半伤
      if(!m.dead && Math.random()*100 < q.dbl){ strike(m,0.55,'连 '); }
    });
    shake=Math.max(shake,0.55); sfx('hit');
    log(sk.name+' Lv'+sk.lv+'：造成约 '+Math.round(p*linkMul*linkBuff)+' 点伤害'+(doubled?'（蓄势×2）':'')+(top?'　最高 '+top:''));
  }

  refresh();

  if(alive().length===0){ winWave(); return; }

  setTimeout(()=>{
    enemyTurn();
  }, 520);
}

function enemyTurn(){
  const st=calcStats();
  const q=st.q;
  alive().forEach((m,i)=>{
    setTimeout(()=>{
      if(m.dead || G.over) return;
      m.atkAnim=0.3;
      let raw=Math.max(1, m.atk - st.s.def*0.5);
      raw=Math.round(raw*(1-q.red/100));   // 减伤
      let d=raw;
      if(shield>0){
        const absorb=Math.min(shield,d);
        shield-=absorb; d-=absorb;
        if(d>0){ php-=d; }
        floatText(PLAYER_X, GROUND-70, absorb?'盾挡 '+absorb:'', '#6fa8c9');
      } else {
        php-=d;
      }
      if(d>0){
        hitFlash=0.45; shake=0.4; pHurt=0.16;
        floatText(PLAYER_X+(Math.random()-0.5)*20, GROUND-80, '-'+d, '#e07a6a');
        sfx('hurt');
      }
      // 反伤：按挨到的伤害回敬
      if(q.reflect>0 && raw>0){
        const rf=Math.max(1, Math.round(raw*q.reflect/100));
        m.hp-=rf; m.hurt=0.16;
        burst(m.x, m.y-10, 6, '#9b7ab0');
        floatText(m.x, m.y-30, '反 '+rf, '#9b7ab0');
        if(m.hp<=0){ m.dead=true; m.hp=0; }
      }
      refresh();
      if(php<=0){ php=0; onDeath(); }
    }, i*120);
  });
  setTimeout(()=>{
    if(G.over) return;
    if(alive().length===0){ winWave(); return; }
    if(buffNext>0) buffNext--;
    G.turn++;
    G.busy=false;
    refresh();
  }, alive().length*120+420);
}

function winWave(){
  G.over=true;
  sfx('win'); shake=0.8;
  burst(400,GROUND-60,40,'#c9a227');
  floatText(320,140,'破阵','#ffd166',true);
  const st=calcStats();
  php=Math.min(st.s.hp, php+Math.round(st.s.hp*0.3));
  G.best=Math.max(G.best,G.wave);
  G.stones+=8+G.wave*4;
  // 掉落两件进背包（不再三选一）
  const d1=makeItem(G.wave), d2=makeItem(G.wave);
  G.bag.push(d1); G.bag.push(d2);
  log('破阵！得 '+d1.name+'、'+d2.name+'，灵石 +'+(8+G.wave*4),'#2f6b52');
  if(G.wave%5===0){
    const all=G.bag.concat(G.slots.filter(Boolean));
    const upg=all.filter(i=>i.affixes.some(a=>a.t>1));
    const grow=all.filter(i=>freeKind(i));
    if(upg.length && (!grow.length || Math.random()<0.45)){
      // 上淬：把已有的一条词条提一档
      const it=upg[Math.floor(Math.random()*upg.length)];
      const pool=it.affixes.filter(a=>a.t>1);
      const a=pool[Math.floor(Math.random()*pool.length)];
      const from=a.t; reTier(a, a.t-1);
      log('奇遇：'+it.name+' 上淬，'+afDef(a).n+' 由 T'+from+' 提到 T'+a.t+'。','#a8811f');
    } else if(grow.length){
      // 生词：长出一条新词条（前缀满 3、后缀满 3 是硬上限）
      const it=grow[Math.floor(Math.random()*grow.length)];
      const kind=freeKind(it);
      const a=rollAffix(effGrade(it), kind, it.x);
      it.affixes.push(a);
      log('奇遇：'+it.name+' 生出「'+afDef(a).n+' +'+a.v+afUnit(a)+'」T'+a.t+(a.t<=2?'，是条好词条！':''),'#a8811f');
    }
  }
  G.wave++;
  // 修为：破阵涨修为，满一级升境界、给 1 点经脉点
  const xg=12+G.wave*4;
  G.xp+=xg;
  let ups=0;
  while(G.xp>=xpNeed(G.lv)){ G.xp-=xpNeed(G.lv); G.lv++; G.pts++; ups++; }
  if(ups) log('修为 +'+xg+'　境界升至 Lv'+G.lv+'，得经脉点 '+ups+'。','#8a5a1f');
  else log('修为 +'+xg+'（'+G.xp+'/'+xpNeed(G.lv)+'）','#6b6154');
  if(location.search.includes('auto')) autoEquip();
  setTimeout(()=>{
    if(G.over===false) return;
    startWave();
  },1400);
  refresh();
}

function effectGrade(it){ return effGrade(it); }

function onDeath(){
  if(G.over) return;
  G.over=true;
  sfx('hurt');
  document.getElementById('modal').innerHTML=
    '<h3>道消</h3>'+
    '<p>第 <b>'+G.wave+'</b> 波，第 <b>'+G.turn+'</b> 回合倒下。最高 <b>'+G.best+'</b> 波。</p>'+
    '<p class="tip">装备都留着。回去看看是不是气血太薄，或者技能威力不够。</p>'+
    '<div class="row"><button onclick="restart()">重整旗鼓</button></div>';
  document.getElementById('mask').classList.add('on');
  refresh();
}

function restart(){
  closeModal();
  G.wave=1;
  startWave();
}

/* ---------- 熔炼 ---------- */
function refine(id){
  const it=G.bag.find(i=>i.id===id) || G.slots.find(i=>i&&i.id===id);
  if(!it) return;
  if(it.affixes.length>=6 || (!freeKind(it))){ log('前缀 / 后缀都满了，炼不进去。','#a83b2c'); return; }
  const cost=25;
  if(G.stones<cost){ log('灵石不足（需 '+cost+'）。','#a83b2c'); return; }
  G.stones-=cost;
  const g=effGrade(it);
  // 品级越高，一次越可能炼出两条
  const add = Math.random()< (g>=4?0.65: g>=2?0.4:0.2) ? 2 : 1;
  let n=0, tiers=[];
  for(let i=0;i<add;i++){
    const kind=freeKind(it);
    if(!kind) break;
    const a=rollAffix(g, kind, it.x);
    it.affixes.push(a); n++; tiers.push('T'+a.t);
  }
  if(it.broken && Math.random()<0.5){ it.broken=false; it.name=it.name.replace('·残',''); }
  if(n) log('熔炼 '+it.name+'：生出 '+n+' 条词条（'+tiers.join('、')+'）。','#a8811f');
  else log('这一炉没有成词。','#a83b2c');
  refresh();
  if(modalItem===id) showItem(id);
}

/* ---------- 弹层：单件装备详情 ---------- */
let modalItem=null;
function showItem(id){
  const it=G.bag.find(i=>i.id===id) || G.slots.find(i=>i&&i.id===id);
  if(!it){ closeModal(); return; }
  modalItem=id;
  const inSlot=G.slots.indexOf(it);
  const rows=it.affixes.length
    ? it.affixes.map(a=>'<div style="display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);padding:2px 0">'+
        '<span style="font-size:12px">'+afLabel(a)+'</span>'+
        '<span style="font-size:10px;color:var(--ink2)">'+(a.kind==='pre'?'前缀':'后缀')+'</span></div>').join('')
    : '<div class="sub2">无词条。拿去熔炼。</div>';
  document.getElementById('modal').innerHTML=
    '<h3 style="color:'+COL[it.x]+'">'+it.name+'</h3>'+
    '<p>'+it.x+'行 · '+it.y+'　'+GNAME[it.grade]+(it.broken?'　<b style="color:var(--cin)">残器（按低一阶算）</b>':'')+
      '　词条 '+it.affixes.length+' / 6（前 '+cntPre(it)+' · 后 '+cntSuf(it)+'）</p>'+
    '<div style="margin:8px 0 4px">'+rows+'</div>'+
    '<p class="tip">前缀加数值，最多 3 条；后缀加百分比，最多 3 条。T1 最强、T5 最弱，品级越高越容易出高 T。</p>'+
    '<div class="row">'+
      (inSlot>=0
        ? '<button onclick="closeModal();unequip('+inSlot+')">卸下</button>'
        : '<button onclick="closeModal();equipFromBag('+it.id+')">佩上三才</button>')+
      '<button onclick="refine('+it.id+')">熔炼 25</button>'+
      '<button onclick="closeModal();sellItem('+it.id+')">卖出</button>'+
      '<button onclick="closeModal()">关上</button></div>';
  document.getElementById('mask').classList.add('on');
}

/* ---------- 配装 ---------- */
function equipFromBag(id){
  const i=G.bag.findIndex(x=>x.id===id);
  if(i<0) return;
  const it=G.bag[i];
  const empty=G.slots.findIndex(s=>!s);
  if(empty>=0){ G.slots[empty]=it; G.bag.splice(i,1); }
  else log('三才位已满，先卸一件。','#a83b2c');
  refresh();
}
function unequip(i){
  const it=G.slots[i];
  if(!it) return;
  G.slots[i]=null; G.bag.push(it);
  refresh();
}
function sellItem(id){
  const i=G.bag.findIndex(x=>x.id===id);
  if(i<0) return;
  const it=G.bag[i];
  const p=Math.round(Math.pow(it.grade,2)*10 + it.affixes.reduce((a,af)=>a+(6-af.t)*5,0));
  G.stones+=p; G.bag.splice(i,1);
  log('卖出 '+it.name+'，得 '+p+' 灵石。');
  refresh();
}

/* ---------- 设置 ---------- */
function setDiff(){
  G.diff=parseFloat(document.getElementById('diff').value);
  if(mobs.length && !G.over){
    const w=makeWave(G.wave);
    mobs.forEach((m,i)=>{ if(w[i]){ m.maxhp=w[i].maxhp; m.hp=Math.min(m.hp,w[i].maxhp); m.atk=w[i].atk; } });
  }
  refresh();
}

/* ---------- 刷新界面 ---------- */
function refresh(){
  const st=calcStats();
  const e=st.e;

  document.getElementById('wave').textContent=G.wave;
  document.getElementById('turn').textContent=G.turn;
  document.getElementById('best').textContent=G.best;

  // 槽
  const box=document.getElementById('slots'); box.innerHTML='';
  for(let i=0;i<3;i++){
    if(i>0){
      const r=(G.slots[i-1]&&G.slots[i])?relOf(G.slots[i-1],G.slots[i]):'—';
      const d=document.createElement('div'); d.className='conn';

    d.innerHTML='<div class="pos">'+['天','人','地'][i]+'位</div>'+
      (it? '<div class="el" style="color:'+COL[it.x]+'">'+it.x+'</div>'+

           '<div class="fx">'+it.y+it.x+' · '+GNAME[it.grade]+(it.broken?'·残':'')+'</div>'+
           '<div class="fx" style="opacity:.8">词 '+it.affixes.length+' / 6</div>'
         : '<div class="el" style="color:var(--line)">空</div><div class="fx">　</div>');
    d.onclick=()=>{ if(G.slots[i]) showItem(G.slots[i].id); };
    box.appendChild(d);
  }

  const mulEl=document.getElementById('mul');
  mulEl.textContent='×'+e.total.toFixed(2);
  mulEl.style.color=e.total>=4?'var(--gold)':e.total>=2?'var(--jade)':e.total>=1?'var(--ink)':'var(--cin)';
  document.getElementById('rels').innerHTML = e.partial? '需三件成阵'
    : (e.r1+' → '+e.r2) + (e.total<1? ' <b style="color:var(--cin)">相克压制，换掉克位</b>':'');
  document.getElementById('school').textContent=(()=>{
    if(e.partial) return '未成阵';

    if(r1==='生'&&r2==='克') return '先扬后抑';
    if(r1==='克'||r2==='克') return '蓄煞·残应';
    if(r1==='比和'&&r2==='比和') return '一元纯体';
    if(r1==='生'||r2==='生') return '单生·正宗';
    return '反哺·守御';
  })();
  document.getElementById('school').style.color=e.total>=4?'var(--gold)':e.total>=2?'var(--jade)':'var(--ink2)';

  // 属性
  const QL=[['crit','暴击',5,'%'],['critDmg','暴伤',50,'%'],['inc','增伤',0,'%'],['red','减伤',0,'%'],
            ['leech','噬血',0,'%'],['reflect','反伤',0,'%'],['pen','破防',0,'%'],['dbl','连击',0,'%'],
            ['healB','疗愈',0,'%'],['sk','技阶',0,'']];
  let qh='';
  QL.forEach(([k,n,base,u])=>{

  });
  const stars=['★','★★','★★★','★★★★','★★★★★','★★★★★★','★★★★★★★'];

    d.className='sk'+(G.busy?' dis':'');
    // 链接：主动技挂着辅助时，威力和提示都要把加成算进去
    const a2 = canLink(s.kind) ? auxOf(i,sk) : null;
    const linkMul = a2 ? (1+(a2.lv||1)*0.06) * (a2.kind==='buff'?1.3:1) : 1;
    let linkRow='';
    if(canLink(s.kind)){
      linkRow='<div class="lk" data-lk="1" onclick="event.stopPropagation();pickLink('+i+')">'+
        (a2? '链 ▸ '+a2.name+' <span style="color:#8a5a1f">Lv'+a2.lv+'</span>' : '<span style="color:#8a5a1f">＋ 挂辅助</span>')+'</div>';
    } else if(isAuxKind(s.kind)){
      const taker=auxTakenBy(i);
      linkRow='<div class="lk dim">辅助'+(taker!=null? ' · 挂于'+STARS[taker] : ' · 可被链')+'</div>';
    }
    d.innerHTML='<div class="nm"><span>'+s.name+' <span class="lv">Lv'+s.lv+'</span></span><span class="star">'+stars[i]+'</span></div>'+
      '<div class="ds">'+s.pos+' · '+s.from+' · '+(s.elem||'')+'</div>'+
      '<div class="ds">'+s.desc+'</div>'+
      '<div class="pw">约 '+Math.round(pw*linkMul)+' 点'+(s.kind==='heal'?'回复':s.kind==='buff'?'增益':s.kind==='shield'?'护盾':'伤害')+
        (a2?'<span style="color:#8a5a1f;font-weight:400">（含链）</span>':'')+'</div>'+
      linkRow;
    d.onclick=()=>castSkill(i);
    skBox.appendChild(d);
  });

  // 行囊
  const bag=document.getElementById('bag'); bag.innerHTML='';
  document.getElementById('bagcnt').textContent='（'+G.bag.length+'）';
  G.bag.forEach(it=>{
    const d=document.createElement('div');
    d.className='item'+(it.broken?' broken':'');
    d.title=it.name+'　'+GNAME[it.grade]+(it.broken?'（残）':'')+'\n'+afText(it);
    const afs=it.affixes.map(a=>afLabel(a)).join('<br>');
    d.innerHTML='<div class="el" style="color:'+COL[it.x]+'">'+it.x+'</div>'+
      '<div class="nm">'+(it.base||it.x)+'</div>'+
      '<div class="n">'+it.y+it.x+' · '+GNAME[it.grade]+(it.broken?'·残':'')+'</div>'+
      '<div class="af">'+(afs||'<span style="color:var(--ink2)">无词条</span>')+'</div>'+
      '<div class="act"><button class="sm" onclick="event.stopPropagation();equipFromBag('+it.id+')">佩</button>'+
      '<button class="sm" onclick="event.stopPropagation();sellItem('+it.id+')">卖</button>'+
      '<button class="sm" onclick="event.stopPropagation();refine('+it.id+')">炼</button></div>';
    d.onclick=()=>showItem(it.id);
    bag.appendChild(d);
  });
  if(!G.bag.length) bag.innerHTML='<div class="sub2">行囊空。打赢一波掉两件。</div>';
}

/* ---------- 经脉弹层 ---------- */
const STARS=['天枢','天璇','天玑','天权','玉衡','开阳','摇光'];
function merState(nd){
  const lv=G.mer[nd.id]||0;
  if(lv>=2) return 'deep';
  if(lv===1) return 'on';
  if(nd.req && !G.mer[nd.req]) return 'lock';
  return 'ready';
}
function onNode(id){
  const nd=MER.find(n=>n.id===id);
  if(!nd) return;
  const lv=G.mer[id]||0;
  if(lv>=2) return;
  if(lv===0 && nd.req && !G.mer[nd.req]){ log('先通「'+MER.find(n=>n.id===nd.req).n+'」。','#a83b2c'); return; }
  if(G.pts<=0){ log('经脉点不够。破阵涨修为，升级给 1 点。','#a83b2c'); return; }
  G.pts--; G.mer[id]=lv+1;
  php=Math.min(php, calcStats().s.hp);
  log((lv===0? '通':'淬')+nd.n+'：'+nd.d+(lv===0?'':'（大成 ×1.8）'),'#8a5a1f');
  refresh(); showMeridian();
}
function showMeridian(){
  const litN=MER.filter(n=>G.mer[n.id]).length;
  const deepN=MER.filter(n=>G.mer[n.id]>=2).length;
  let lines='', nodes='';
  MER.forEach(nd=>{
    if(!nd.req) return;
    const p=MER.find(n=>n.id===nd.req), on=!!G.mer[nd.id];
    lines+='<line x1="'+p.x+'" y1="'+p.y+'" x2="'+nd.x+'" y2="'+nd.y+'" stroke="'+(on?'#8a5a1f':'#d9d0b8')+
      '" stroke-width="'+(on?2.6:1.4)+'"'+(on?'':' stroke-dasharray="3 3"')+'/>';
  });
  MER.forEach(nd=>{
    const st=merState(nd);
    const on=(st==='on'||st==='deep');
    const ready=(st==='ready'||st==='on') && G.pts>0;   // 已通还能再淬一次
    const deep=st==='deep';
    const fill=deep?'#5c3a10':st==='on'?'#8a5a1f':(ready?'#fffdf7':'#e7dcc2');
    const scol=deep?'#a8811f':st==='on'?'#5c3a10':(ready?'#8a5a1f':'#c3b795');
    const right=nd.x>170;
    const lx=right? nd.x+11 : nd.x-11;
    const anc=right?'start':'end';
    const tip=nd.n+'　'+nd.d+(deep?'（大成）':st==='on'?'（已通，可再淬）':
      st==='lock'?'（需先通'+MER.find(n=>n.id===nd.req).n+'）':'（需 1 点）');
    nodes+='<g class="node'+(ready?' on':'')+'" '+(ready?'onclick="onNode(\''+nd.id+'\')"':'')+'>'+
      '<title>'+tip+'</title>'+
      (deep?'<circle cx="'+nd.x+'" cy="'+nd.y+'" r="10" fill="none" stroke="#a8811f" stroke-width="1.6"/>':'')+
      '<circle cx="'+nd.x+'" cy="'+nd.y+'" r="7" fill="'+fill+'" stroke="'+scol+'" stroke-width="'+(st==='on'&&ready?'2.6':'2')+'"/>'+
      (on?'<circle cx="'+nd.x+'" cy="'+nd.y+'" r="2.6" fill="'+(deep?'#e8c06a':'#f4efe2')+'"/>':'')+
      '<text x="'+lx+'" y="'+(nd.y+3.2)+'" text-anchor="'+anc+'" font-size="9" fill="'+
        (deep?'#a8811f':on?'#5c3a10':ready?'#8a5a1f':'#9a9077')+'" font-family="PingFang SC,monospace"'+
        ' stroke="#faf6ea" stroke-width="2.6" paint-order="stroke" stroke-linejoin="round">'+nd.n+'</text>'+
      '</g>';
  });
  const body=
    '<svg viewBox="0 0 320 460" width="320" height="460" style="display:block">'+
      '<g fill="#e4d9bd" stroke="#bfae8a" stroke-width="1.3" stroke-linejoin="round">'+
        '<circle cx="160" cy="62" r="26"/>'+
        '<rect x="151" y="84" width="18" height="14"/>'+
        '<path d="M118 100 Q160 90 202 100 L194 176 Q188 216 190 252 L130 252 Q132 216 126 176 Z"/>'+
        '<path d="M118 102 L103 114 L95 178 L110 183 L123 126 Z"/>'+
        '<path d="M202 102 L217 114 L225 178 L210 183 L197 126 Z"/>'+
        '<path d="M131 250 L124 404 L147 404 L152 250 Z"/>'+
        '<path d="M169 250 L173 404 L196 404 L189 250 Z"/>'+
      '</g>'+
      lines+nodes+
    '</svg>';

  let list='';
  MER.forEach(nd=>{
    const lv=G.mer[nd.id]||0;
    if(!lv) return;
    const d=lv>=2? nd.d.replace(/([+\d.]+)/, m=>'+'+Math.round(parseFloat(m)*1.8)) : nd.d;
    list+='<div class="mrow"><span>'+nd.n+(lv>=2?' <span style="color:#a8811f;font-size:10px">大成</span>':'')+
      '</span><b style="color:#8a5a1f">'+d+'</b></div>';
  });
  document.getElementById('modal').innerHTML=
    '<h3>经脉图</h3>'+
    '<div class="merbar">境界 <b>Lv'+G.lv+'</b>'+
      '<div class="xpbar"><i style="width:'+Math.min(100,G.xp/xpNeed(G.lv)*100)+'%"></i></div>'+
      '<span class="sub2">'+G.xp+' / '+xpNeed(G.lv)+'</span>'+
      '<span style="margin-left:auto">可点 <b style="color:#8a5a1f">'+G.pts+'</b> 点 · 已通 '+litN+' / '+MER.length+
      ' · 大成 '+deepN+'</span></div>'+
    '<div class="merwrap"><div class="merbody">'+body+'</div>'+
      '<div class="merinfo">'+
        '<h4>已通</h4>'+(list||'<div class="sub2">尚未通任何经脉。先点「会阴」。</div>')+
        '<h4>怎么得点</h4><div class="sub2">破阵涨修为，修为满一级，境界 +1，得 1 点经脉点。<br>'+
        '已通的穴还能再点一次「大成」，效果 ×1.8。<br>经脉加成是永久的，重开一局会清空。</div>'+
      '</div></div>'+
    '<div class="row"><button onclick="closeModal()">关上</button></div>';
  document.getElementById('mask').classList.add('on');
}

/* ---------- 技能链接弹层 ---------- */
function setLink(m,n){
  if(n==null) delete G.links[m]; else G.links[m]=n;
  closeModal(); refresh();
}
function pickLink(mainIdx){
  const sk=buildSkills();
  const main=sk[mainIdx];
  if(!main||!canLink(main.kind)) return;
  let html='<h3>「'+main.name+'」挂辅助</h3>'+
    '<p class="tip">挂上的辅助技会随这一招同步施放（六成强度，不占回合），并给主技加威力：辅助每级 +6%。<br>'+
    '一个辅助星位只能挂一个主技。</p>'+
    '<div style="display:flex;flex-direction:column;gap:5px;margin:10px 0">';
  let any=false;
  sk.forEach((s,j)=>{
    if(!s||!isAuxKind(s.kind)) return;
    any=true;
    const taker=auxTakenBy(j);
    const busy=taker!=null && taker!==mainIdx;
    const cur=G.links[mainIdx]===j;
    html+='<button '+(busy?'disabled':'')+' onclick="setLink('+mainIdx+','+j+')" style="text-align:left">'+
      (cur?'▣ ':'▢ ')+STARS[j]+' · '+s.name+' <b style="color:#8a5a1f">Lv'+s.lv+'</b>　'+
      (busy? '<span style="color:var(--cin)">已挂于'+STARS[taker]+'</span>' : '<span style="color:var(--ink2)">'+s.desc+'</span>')+
      '</button>';
  });
  if(!any) html+='<div class="sub2">这一套里没有辅助技（治疗／护盾／蓄势）。换换装备，或者把某件卸了重配。</div>';
  html+='</div><div class="row">'+
    (G.links[mainIdx]!=null? '<button onclick="setLink('+mainIdx+',null)">拆链</button>':'')+
    '<button onclick="closeModal()">关上</button></div>';
  document.getElementById('modal').innerHTML=html;
  document.getElementById('mask').classList.add('on');
}

/* ---------- 弹层 ---------- */
function closeModal(){ modalItem=null; document.getElementById('mask').classList.remove('on'); }
function showHelp(){
  document.getElementById('modal').innerHTML=
    '<h3>怎么玩</h3>'+
    '<p><b>1. 配</b>：三件装备分天、人、地。相邻两件「相生」×2，「相克」×¼。</p>'+
    '<p><b>2. 出招</b>：七星里的七个技能，全部由你的三才组合推导出来——三件各生一个本源技，两对关系各生一个合击技，整体结构生一个阵技，缺的两行生一个劫技。</p>'+
    '<p><b>3. 打</b>：点技能出招，敌人会一起还手。打空一波，下一波更多、更硬。</p>'+
    '<p><b>4. 炼</b>：词条分<b>前缀</b>（气血／攻击／法攻／防御，直接加数值，最多 3 条）与<b>后缀</b>（暴击／暴伤／增伤／减伤／噬血／反伤／破防／连击，按百分比，最多 3 条），合计上限 6 条。装备天生 1 前 1 后，熔炼每次加 1~2 条（25 灵石）；每 5 波有奇遇，或长新词条、或把一条词上淬（T 提一档）。</p>'+
    '<p><b>5. 品级</b>：词条带 T1~T5，<b style="color:#a83b2c">T1 最强</b>，<b style="color:#8d8474">T5 最弱</b>。装备品级越高，越容易出高 T；残器按低一阶算。</p>'+
    '<p><b>6. 底子</b>：五行决定词条倾向——金主锐（攻击／破防）、木主生（气血／噬血）、水主柔（法攻／减伤）、火主烈（攻击／暴伤）、土主厚（防御／反伤）。想要什么词条，先去找对应五行的底子。</p>'+
    '<p><b>7. 技阶</b>：稀有后缀「技阶」涨技能等级；本源技看自己那件装备，合击技取两边均值，阵技／劫技取三件均值。技能上限 <b>Lv7</b>，每级威力 +18%。</p>'+
    '<p><b>8. 链</b>：主动技可以挂一个辅助技（治疗／护盾／蓄势）。出招时辅助随招同步施放（六成强度，不占回合），并按等级给主技加威力（每级 +6%）。一个辅助只能挂一个主技。</p>'+
    '<p><b>9. 经脉</b>：破阵涨修为，满一级升境界、得 1 点经脉点。点顶部「经脉」开图，从「会阴」起手，任督上行入百会，两臂由膻中分出，下肢一路到涌泉。十二穴给的是永久属性；已通的穴还能再点一次「大成」，效果 ×1.8。</p>'+
    '<p class="tip">三才决定「能打出多少倍」，词条决定「这一倍里有多少料」。<br>'+
    '前期先凑相生把倍率拉到 ×2 以上，后期靠后缀堆暴击暴伤、或者堆减伤反伤走磨血。<br>'+
    '前缀 3 条 + 后缀 3 条是硬上限——想全都塞进去，得挑一件好底子。</p>'+
    '<div class="row"><button onclick="closeModal()">开始</button></div>';
  document.getElementById('mask').classList.add('on');
}

/* ---------- 重置 ---------- */
/* 手上是否凑得出乘算 ≥2 的三件 */
function hasGoodCombo(pool){
  for(let i=0;i<pool.length;i++)
    for(let j=i+1;j<pool.length;j++)
      for(let k=j+1;k<pool.length;k++)
        if(evaluate([pool[i],pool[j],pool[k]]).total>=2) return true;
  return false;
}

function resetAll(){
  G.wave=1; G.turn=1; G.best=0; G.stones=40;
  G.bag=[]; G.slots=[null,null,null]; G.log=[]; G.over=false;
  G.lv=1; G.xp=0; G.pts=0; G.mer={}; G.links={};
  // 保证开局一定有能用的组合，不会一上来就卡死
  let tries=0;
  do{
    G.bag=[];
    for(let i=0;i<6;i++) G.bag.push(makeItem(1));
    tries++;
  } while(tries<25 && !hasGoodCombo(G.bag));
  document.getElementById('log').innerHTML='';
  startWave();
}

/* ---------- 自测辅助 ---------- */
function autoEquip(){
  G.slots.forEach((it,i)=>{ if(it){ G.bag.push(it); G.slots[i]=null; } });
  const pool=G.bag.slice();
  let best=null,bm=-1;
  for(let i=0;i<pool.length;i++)
    for(let j=0;j<pool.length;j++)
      for(let k=0;k<pool.length;k++){
        if(i===j||j===k||i===k) continue;
        const arr=[pool[i],pool[j],pool[k]];
        const t=evaluate(arr).total;
        if(t>bm){ bm=t; best=arr; }
      }
  if(!best){ for(let i=0;i<3 && G.bag.length;i++) G.slots[i]=G.bag.shift(); refresh(); return; }
  best.forEach(it=>{ const k=G.bag.indexOf(it); if(k>=0) G.bag.splice(k,1); });
  G.slots=best;
  refresh();
}

/* ---------- 启动 ---------- */
window.onerror=(m,s,l)=>{ document.title='ERR: '+m+' @'+l; };
resetAll();
requestAnimationFrame(loop);
if(!location.search.includes('nohelp')) showHelp();
if(location.search.includes('auto')){
  autoEquip();
  setInterval(()=>{
    if(G.busy||G.over||!alive().length) return;
    const sk=buildSkills();
    let pick=-1;
    for(let i=0;i<sk.length;i++){
      if(sk[i] && sk[i].kind!=='heal' && sk[i].kind!=='shield'){ pick=i; break; }
    }
    if(pick<0) for(let i=0;i<sk.length;i++){ if(sk[i]){ pick=i; break; } }
    if(pick>=0) castSkill(pick);
  }, 760);
}
